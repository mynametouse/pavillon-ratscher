# feat/wetter: recordings of the weather's sounds (rain, rain on a roof, wind, thunder) from Wikimedia Commons – the chat machine is
# rate-limited there. viz3/extra/wetter/quellen/ton.py: 'survey' downloads every candidate, reads its licence lines, measures it and draws a
# spectrogram; then the picks are cut, levelled and encoded. Everything comes back as the artifact 'wetter-ton' (gh run download); the
# finals are copied into viz3/extra/wetter/dist/wetter/ by hand. Nothing is pushed from here.
name: Wetter – Geräusche

on:
  push:
    branches: ['feat/wetter']
    paths: ['viz3/extra/wetter/quellen/**', '.github/workflows/wetter-ton.yml']

concurrency:
  group: wetter-ton
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sounds:
    name: Aufnahmen holen, sichten, schneiden
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Werkzeuge
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ffmpeg >/dev/null
          pip install --quiet numpy
      - name: Sichten
        run: mkdir -p out && python -u viz3/extra/wetter/quellen/ton.py survey "$RUNNER_TEMP/dl" out/wetter-ton/survey 2>&1 | tee out/survey.log || true
      - name: Schneiden
        run: |
          python -u viz3/extra/wetter/quellen/ton.py "$RUNNER_TEMP/dl" 2>&1 | tee out/build.log || true
          mkdir -p out/wetter-ton/final && cp -r viz3/extra/wetter/dist/wetter/. out/wetter-ton/final/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wetter-ton
          path: out/
          retention-days: 5
