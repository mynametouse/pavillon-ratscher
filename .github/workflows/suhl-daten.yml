# Suhl-Datenhaus (Stufe 2 des Suhl-Plans, Paket S2-0, Auftrag docs/plans/auftraege/suhl-daten.md): Probe des Veröffentlichens.
# Schreibt mit secrets.DATEN_TOKEN eine winzige Datei suhl/_probe/hallo.json (Zeit, Lauf, Commit) nach main von
# mynametouse/pavillon-daten und prüft, ob GitHub Pages sie ausliefert. Fehlt das Geheimnis oder das Repo, sagt der Lauf das klar
# (Protokoll und Zusammenfassung) und schlägt nicht fehl. In dieses Repo schreibt er nichts.
# Läuft nur auf suhl/daten und nur, wenn diese Datei, die Aktion oder tools/suhl/daten/lauf.txt sich ändert
# (lauf.txt ändern = neuen Lauf bestellen).
name: Suhl – Datenhaus (Probe)

on:
  push:
    branches: ['suhl/daten']
    paths: ['.github/workflows/suhl-daten.yml', '.github/actions/suhl-publish/**', 'tools/suhl/daten/lauf.txt']

permissions:
  contents: read

jobs:
  hallo:
    name: Probe – hallo.json ins Daten-Repo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: suhl-daten-publish        # eine Gruppe für alle veröffentlichenden Jobs des Repos, nie abbrechen
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Bibliothek (Einheitentests ohne Netz)
        run: python3 -I tools/suhl/lib/test_lib.py
      - name: Probe veröffentlichen
        id: pub
        uses: ./.github/actions/suhl-publish
        with:
          mode: hallo
          token: ${{ secrets.DATEN_TOKEN }}
      - name: Liefert GitHub Pages die Datei aus?
        if: ${{ steps.pub.outputs.published == 'true' }}
        env:
          URL: ${{ steps.pub.outputs.url }}
          RUN: ${{ github.run_id }}
        run: |
          ok=0
          for i in $(seq 1 30); do
            code=$(curl -sS -o /tmp/hallo.json -w '%{http_code}' -H 'Cache-Control: no-cache' "$URL?t=$i" || echo 000)
            if [ "$code" = "200" ] && grep -q "\"lauf\": \"$RUN\"" /tmp/hallo.json; then ok=1; break; fi
            echo "Versuch $i: HTTP $code – noch nicht der Stand dieses Laufs; warte 10 s"
            sleep 10
          done
          if [ "$ok" = "1" ]; then
            echo "Pages liefert $URL mit dem Stand dieses Laufs (nach etwa $((i * 10 - 10)) s)."
            echo "- GitHub Pages liefert die Datei aus: $URL (nach etwa $((i * 10 - 10)) s)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Pages liefert $URL nach 5 Minuten noch nicht mit dem Stand dieses Laufs (zuletzt HTTP $code)."
            echo "- ⚠️ GitHub Pages liefert die Datei nach 5 Minuten noch nicht mit dem Stand dieses Laufs (zuletzt HTTP $code): $URL" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Ergebnis
        if: ${{ always() }}
        env:
          PUBLISHED: ${{ steps.pub.outputs.published }}
          REASON: ${{ steps.pub.outputs.reason }}
        run: |
          echo "published=$PUBLISHED"
          echo "reason=$REASON"
