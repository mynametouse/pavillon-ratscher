# Suhl-Datenhaus (Stufe 2 des Suhl-Plans, Paket S2-0, Auftrag docs/plans/auftraege/suhl-daten.md). Zwei Proben, einzeln bestellbar:
#   hallo        schreibt mit secrets.DATEN_TOKEN eine winzige Datei suhl/_probe/hallo.json (Zeit, Lauf, Commit) nach main von
#                mynametouse/pavillon-daten und prüft, ob GitHub Pages sie ausliefert (Aktion .github/actions/suhl-publish).
#   easygeodata  fragt mit secrets.EASYGEODATA_KEY die Schnittstelle von easygeodata.de: gilt der Schlüssel, was bietet sie für
#                Suhl (DGM1, DOM1, nDOM1), eine Kachel als Beweis. Nur über die Schnittstelle, höflich, nichts wird veröffentlicht.
#   egd-client   der Client tools/suhl/lib/easygeodata.py so, wie ihn die anderen Workflows benutzen: die 8 Kacheln P1 von DGM1,
#                DOM1 und nDOM1 in einen Rohdaten-Ordner mit Cache, dann jede Kachel mit tools/welt/fetch.py gelesen.
#   satz         DIE EINE TÜR ins Daten-Repo: bringt den Satz aus tools/suhl/daten/satz.json (je Produkt Lauf, Artefakt, Version)
#                als EINEN Commit nach mynametouse/pavillon-daten und schaltet suhl/aktuell.json um - oder macht, solange dort
#                dry_run: true steht, alles außer dem Push und druckt den Bericht. Die Daten-Workflows veröffentlichen nicht selbst.
#   zahlen       Paket S2-9: holt die Zensus-Gitter 2022 (amtliche Download-Seite), schneidet sie auf Suhl und rechnet aus den
#                Gebäude-Datensätzen (Quelle in tools/suhl/daten/zahlen.json: Lauf + Artefakt oder Zweig + Commit + Ordner) die
#                Szenario-Zahlen je Gebäude und Stadtteil. Ergebnis: Artefakt „suhl-d-v<N>“ (der Versionsordner) für die eine Tür.
# Fehlt ein Geheimnis, sagt der Lauf das klar (Protokoll und Zusammenfassung) und schlägt nicht fehl. In dieses Repo schreibt er nichts.
# Läuft nur auf suhl/daten und nur, wenn tools/suhl/daten/lauf.txt sich ändert (lauf.txt ändern = neuen Lauf bestellen); die letzte
# Zeile "lauf: <job> <job> …" nennt die Jobs. Der Lauf nimmt den neuesten Stand des Zweigs.
name: Suhl – Datenhaus (Proben, Tür, Zahlen)

on:
  push:
    branches: ['suhl/daten']
    paths: ['tools/suhl/daten/lauf.txt']

permissions:
  contents: read

jobs:
  plan:
    name: Was ist bestellt?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      hallo: ${{ steps.p.outputs.hallo }}
      easygeodata: ${{ steps.p.outputs.easygeodata }}
      egd-client: ${{ steps.p.outputs.egd-client }}
      satz: ${{ steps.p.outputs.satz }}
      zahlen: ${{ steps.p.outputs.zahlen }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: suhl/daten
          persist-credentials: false
      - id: p
        run: |
          line=$(grep -E '^lauf:' tools/suhl/daten/lauf.txt | tail -1 || true)
          echo "bestellt: $line"
          for j in hallo easygeodata egd-client satz zahlen; do
            if echo " ${line#lauf:} " | grep -q " $j "; then echo "$j=true" >> "$GITHUB_OUTPUT"; else echo "$j=false" >> "$GITHUB_OUTPUT"; fi
          done
          echo "Bestellt: \`$line\`" >> "$GITHUB_STEP_SUMMARY"

  hallo:
    name: Probe – hallo.json ins Daten-Repo
    needs: plan
    if: ${{ needs.plan.outputs.hallo == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: suhl-daten-publish        # eine Gruppe für alle veröffentlichenden Jobs des Repos, nie abbrechen
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: suhl/daten
          persist-credentials: false
      - name: Bibliothek und Schema (Einheitentests ohne Netz)
        run: |
          python3 -I tools/suhl/lib/test_lib.py
          python3 -I tools/suhl/lib/test_schema.py
      - name: Probe veröffentlichen
        id: pub
        uses: ./.github/actions/suhl-publish
        with:
          mode: hallo
          token: ${{ secrets.DATEN_TOKEN }}
      - name: Liefert GitHub Pages die Datei aus?
        if: ${{ steps.pub.outputs.published == 'true' }}
        env:
          URL: ${{ steps.pub.outputs.url }}
          RUN: ${{ github.run_id }}
        run: |
          ok=0
          for i in $(seq 1 30); do
            code=$(curl -sS -o /tmp/hallo.json -w '%{http_code}' -H 'Cache-Control: no-cache' "$URL?t=$i" || echo 000)
            if [ "$code" = "200" ] && grep -q "\"lauf\": \"$RUN\"" /tmp/hallo.json; then ok=1; break; fi
            echo "Versuch $i: HTTP $code – noch nicht der Stand dieses Laufs; warte 10 s"
            sleep 10
          done
          if [ "$ok" = "1" ]; then
            echo "Pages liefert $URL mit dem Stand dieses Laufs (nach etwa $((i * 10 - 10)) s)."
            echo "- GitHub Pages liefert die Datei aus: $URL (nach etwa $((i * 10 - 10)) s)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Pages liefert $URL nach 5 Minuten noch nicht mit dem Stand dieses Laufs (zuletzt HTTP $code)."
            echo "- ⚠️ GitHub Pages liefert die Datei nach 5 Minuten noch nicht mit dem Stand dieses Laufs (zuletzt HTTP $code): $URL" >> "$GITHUB_STEP_SUMMARY"
          fi

  easygeodata:
    name: Probe – easygeodata (Schlüssel, Angebot für Suhl, eine Kachel)
    needs: plan
    if: ${{ needs.plan.outputs.easygeodata == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: suhl-daten-easygeodata
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: suhl/daten
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Werkzeuge
        run: pip install --quiet numpy tifffile imagecodecs
      - name: Probe
        env:
          EASYGEODATA_KEY: ${{ secrets.EASYGEODATA_KEY }}
        run: |
          phase=$(grep -E '^phase:' tools/suhl/daten/lauf.txt | tail -1 | sed 's/^phase:[[:space:]]*//' || true)
          python3 -I tools/suhl/daten/easygeodata_probe.py --out probe-out --phase "${phase:-docs}"
      - name: Ergebnis aufheben (ohne Schlüssel, ohne Rohdaten)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: easygeodata-probe
          path: probe-out/easygeodata_probe.json
          retention-days: 30
          if-no-files-found: warn

  egd-client:
    name: Probe – easygeodata-Client (P1, drei Produkte, mit Cache)
    needs: plan
    if: ${{ needs.plan.outputs.egd-client == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: suhl-daten-easygeodata
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: suhl/daten
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rohdaten aus dem Cache (Kacheln früherer Läufe)
        uses: actions/cache@v4
        with:
          path: ~/suhl-raw
          key: suhl-raw-egd-v1-${{ github.run_id }}
          restore-keys: suhl-raw-egd-v1-
      - name: Werkzeuge
        run: pip install --quiet numpy tifffile imagecodecs
      - name: Tests des Clients (ohne Netz)
        run: python3 -I tools/suhl/lib/test_easygeodata.py
      - name: Höhen von easygeodata (übersprungen, wenn der Schlüssel fehlt)
        env:
          EASYGEODATA_KEY: ${{ secrets.EASYGEODATA_KEY }}
        run: python3 -I tools/suhl/lib/easygeodata.py --product dgm,dom,ndom --prio P1 --raw ~/suhl-raw --report egd.json
      - name: Zwei Korridor-Kacheln (P4, außerhalb der Gemeinde) über einen Rahmen
        env:
          EASYGEODATA_KEY: ${{ secrets.EASYGEODATA_KEY }}
        run: |
          T=$(python3 -I -c "import sys; sys.path.insert(0, 'tools/suhl/lib'); import easygeodata as EG; p = EG.prio_tiles(['P4']); print(','.join(f'{e}_{n}' for e, n in (p[0], p[-1])))")
          echo "P4-Kacheln: $T"
          python3 -I tools/suhl/lib/easygeodata.py --product dgm --tiles "$T" --raw ~/suhl-raw --report egd-p4.json
          python3 -I - <<'PY'
          import json, os, sys
          sys.path.insert(0, 'tools/suhl/lib')
          import easygeodata as EG
          import numpy as np
          egd = EG.Easygeodata(raw=os.path.expanduser('~/suhl-raw'))
          r = json.load(open('egd-p4.json'))['reports'][0]
          print('report:', json.dumps({k: r[k] for k in ('wanted', 'present', 'fetched', 'cached', 'missing', 'failed', 'stopped', 'calls')}))
          p = EG.prio_tiles(['P4'])
          for e, n in (p[0], p[-1]):
              t = egd.read('dgm', e, n)
              print(f'P4 dgm {e}/{n}:', 'not there' if t is None else f'{t[0].shape} corner {t[1]:.0f}/{t[2]:.0f} min {np.nanmin(t[0]):.2f} max {np.nanmax(t[0]):.2f} empty {int(np.isnan(t[0]).sum())}')
          PY
      - name: Jede Kachel mit dem Leser der Welt-Pipeline lesen
        run: |
          python3 -I - <<'PY'
          import json, os, sys
          sys.path.insert(0, 'tools/suhl/lib')
          import easygeodata as EG
          import numpy as np
          egd = EG.Easygeodata(raw=os.path.expanduser('~/suhl-raw'))
          print('files in the raw folder:', sum(len(f) for _, _, f in os.walk(egd.raw)), 'MB:', round(sum(os.path.getsize(os.path.join(d, x)) for d, _, f in os.walk(egd.raw) for x in f) / 1e6, 1))
          for prod in ('dgm', 'dom', 'ndom'):
              for e, n in EG.prio_tiles(['P1']):
                  t = egd.read(prod, e, n)
                  if t is None:
                      print(prod, e, n, 'not there')
                      continue
                  a, e0, n1, px = t
                  ok = a.shape == (1000, 1000) and e0 == e * 1000.0 and n1 == n * 1000.0 + 1000.0 and px == 1.0
                  print(f'{prod} {e}/{n}: {a.shape} px {px} corner {e0:.0f}/{n1:.0f} min {np.nanmin(a):.2f} max {np.nanmax(a):.2f} mean {np.nanmean(a):.2f} empty {int(np.isnan(a).sum())} fits {ok}')
              print(prod, 'data stand:', egd.data_stand(prod), '| source entry:', json.dumps(egd.sources_entry(prod), ensure_ascii=False))
          PY
      - name: Bericht aufheben
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: easygeodata-client-bericht
          path: egd.json
          retention-days: 30
          if-no-files-found: warn

  satz:
    name: Satz ins Daten-Repo (oder Trockenlauf)
    needs: plan
    if: ${{ needs.plan.outputs.satz == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read                    # Artefakte anderer Läufe dieses Repos holen
    concurrency:
      group: suhl-daten-publish        # eine Gruppe für alles, was ins Daten-Repo schreibt, nie abbrechen
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: suhl/daten
          persist-credentials: false
      - name: Tests (Bibliothek, Schema, Veröffentlicher – ohne Netz)
        run: |
          python3 -I tools/suhl/lib/test_lib.py
          python3 -I tools/suhl/lib/test_schema.py
          python3 -I .github/actions/suhl-publish/test_publish.py
      - name: Satz veröffentlichen
        id: pub
        uses: ./.github/actions/suhl-publish
        with:
          mode: set
          set: tools/suhl/daten/satz.json
          token: ${{ secrets.DATEN_TOKEN }}
          github-token: ${{ github.token }}
      - name: Liefert GitHub Pages den neuen Stand aus?
        if: ${{ steps.pub.outputs.published == 'true' }}
        env:
          URL: ${{ steps.pub.outputs.url }}
          COMMIT: ${{ steps.pub.outputs.commit }}
        run: |
          want=$(python3 -c "import json;print(json.load(open('$RUNNER_TEMP/pavillon-daten/suhl/aktuell.json'))['made'])")
          ok=0
          for i in $(seq 1 36); do
            code=$(curl -sS -o /tmp/aktuell.json -w '%{http_code}' -H 'Cache-Control: no-cache' "$URL?t=$i" || echo 000)
            if [ "$code" = "200" ] && grep -q "\"made\": \"$want\"" /tmp/aktuell.json; then ok=1; break; fi
            echo "Versuch $i: HTTP $code – noch nicht der Stand von $COMMIT; warte 10 s"
            sleep 10
          done
          if [ "$ok" = "1" ]; then
            echo "- GitHub Pages liefert aktuell.json mit dem neuen Stand aus (nach etwa $((i * 10 - 10)) s): $URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Pages liefert $URL nach 6 Minuten noch nicht mit dem neuen Stand (zuletzt HTTP $code)."
            echo "- ⚠️ GitHub Pages liefert aktuell.json nach 6 Minuten noch nicht mit dem neuen Stand (zuletzt HTTP $code)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Was ein Browser bekommt – Status, CORS, Cache, Größe (aktuell.json und eine Kachel je Produkt)
        if: ${{ steps.pub.outputs.published == 'true' }}
        env:
          URL: ${{ steps.pub.outputs.url }}
        run: |
          base="${URL%aktuell.json}"
          cd "$RUNNER_TEMP/pavillon-daten/suhl"
          {
            echo "aktuell.json"
            for p in */; do
              f=$(find "$p" -type f \( -name '*.json' -o -name '*.bin' -o -name '*.webp' \) ! -name index.json ! -name meta.json ! -name viertel.json | sort | head -1)
              i=$(find "$p" -maxdepth 2 -type f \( -name index.json -o -name meta.json \) | sort | tail -1)
              [ -n "$i" ] && echo "$i"
              [ -n "$f" ] && echo "$f"
            done
          } > /tmp/proben.txt
          {
            echo ""
            echo "**Was ein Browser bekommt** (Abruf von einem fremden Ursprung, mit gzip):"
            echo ""
            echo "| Datei | Status | access-control-allow-origin | cache-control | content-type | content-encoding | Bytes übertragen | Bytes entpackt |"
            echo "|---|---|---|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          bad=0
          while read -r f; do
            w=$(curl -sS -m 60 --compressed -H 'Origin: http://localhost:8000' -D /tmp/h.txt -o /tmp/body.bin -w '%{http_code} %{size_download}' "$base$f?t=$GITHUB_RUN_ID" || echo "000 0")
            code=${w%% *}; sent=${w##* }
            hdr() { grep -i "^$1:" /tmp/h.txt | tail -1 | cut -d' ' -f2- | tr -d '\r'; }
            line="| \`$f\` | $code | $(hdr access-control-allow-origin) | $(hdr cache-control) | $(hdr content-type) | $(hdr content-encoding) | $sent | $(wc -c < /tmp/body.bin) |"
            echo "$line" | tee -a "$GITHUB_STEP_SUMMARY"
            [ "$code" = "200" ] || bad=1
          done < /tmp/proben.txt
          if [ "$bad" = "1" ]; then echo "::warning::Nicht jede Probe-Datei kam mit HTTP 200 von GitHub Pages (Tabelle in der Zusammenfassung)."; fi

  zahlen:
    name: Szenario-Zahlen (S2-9) – Zensus-Gitter, Zahlen je Gebäude und Stadtteil
    needs: plan
    if: ${{ needs.plan.outputs.zahlen == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read                    # die Gebäude-Datensätze sind das Artefakt eines anderen Laufs dieses Repos
    steps:
      - uses: actions/checkout@v4
        with:
          ref: suhl/daten
          persist-credentials: false
      - name: Tests (Bibliothek, Schema, Zahlen, Zensus – ohne Netz)
        run: |
          python3 -I tools/suhl/lib/test_lib.py
          python3 -I tools/suhl/lib/test_schema.py
          python3 -I tools/suhl/daten/test_zahlen.py
          python3 -I tools/suhl/daten/test_zensus.py
      - name: Auftrag (tools/suhl/daten/zahlen.json)
        id: auftrag
        run: |
          python3 -I - <<'PY'
          import json, os, re
          d = json.load(open('tools/suhl/daten/zahlen.json'))
          g = d['g']
          v = int(d['version'])
          area = d.get('area', 'stadt')
          assert area in ('stadt', 'kernstadt', 'zentrum', 'probe'), area
          out = {'version': v, 'area': area, 'run': '', 'artifact': '', 'commit': '', 'path': ''}
          if 'run' in g:
              assert re.fullmatch(r'[0-9]+', str(g['run'])) and re.fullmatch(r'[A-Za-z0-9._-]+', g['artifact']), g
              out.update(run=str(g['run']), artifact=g['artifact'])
          else:
              assert re.fullmatch(r'[0-9a-f]{7,40}', g['commit']) and re.fullmatch(r'[A-Za-z0-9._/-]+', g['path']) and '..' not in g['path'], g
              out.update(commit=g['commit'], path=g['path'].strip('/'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              for k, val in out.items():
                  f.write(f'{k}={val}\n')
          print('Auftrag:', out)
          PY
      - name: Gebäude-Datensätze holen (Artefakt eines Laufs oder Ordner eines Commits)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ steps.auftrag.outputs.run }}
          ART: ${{ steps.auftrag.outputs.artifact }}
          COMMIT: ${{ steps.auftrag.outputs.commit }}
          GPATH: ${{ steps.auftrag.outputs.path }}
        run: |
          mkdir -p "$RUNNER_TEMP/g"
          if [ -n "$RUN" ]; then
            gh run download "$RUN" --repo "$GITHUB_REPOSITORY" -n "$ART" -D "$RUNNER_TEMP/g"
          else
            git fetch -q --depth 1 origin "$COMMIT"          # the repository is public: no token needed to read
            git archive FETCH_HEAD "$GPATH" | tar -x -C "$RUNNER_TEMP/g" --strip-components="$(echo "$GPATH" | awk -F/ '{print NF}')"
          fi
          ls "$RUNNER_TEMP/g" | head; du -sh "$RUNNER_TEMP/g"
          test -f "$RUNNER_TEMP/g/index.json"
      - name: Zensus-Gitter aus dem Cache (Downloads früherer Läufe)
        uses: actions/cache@v4
        with:
          path: ~/suhl-raw/zensus
          key: suhl-raw-zensus-v1-${{ github.run_id }}
          restore-keys: |
            suhl-raw-zensus-v1-
      - name: Zensus-Gitter 2022 holen und auf Suhl schneiden (fehlt ein Thema, wird es übersprungen)
        run: |
          set -o pipefail
          python3 -I -u tools/suhl/daten/zensus.py --fetch --raw ~/suhl-raw/zensus --out "$RUNNER_TEMP/zensus" 2>&1 | cut -c1-400 | tee "$RUNNER_TEMP/zensus.log"
          if [ ! -s "$RUNNER_TEMP/zensus/einwohner.json" ]; then
            echo "::warning::Das Zensus-Gitter der Einwohner war nicht zu holen – es gelten die Zellen, die auf dem Zweig liegen (tools/suhl/out/daten/zensus)."
            rm -rf "$RUNNER_TEMP/zensus"; cp -r tools/suhl/out/daten/zensus "$RUNNER_TEMP/zensus"
          fi
          ls -la "$RUNNER_TEMP/zensus"
      - name: Zahlen rechnen (tools/suhl/daten/zahlen.py)
        env:
          V: ${{ steps.auftrag.outputs.version }}
          AREA: ${{ steps.auftrag.outputs.area }}
          GFROM: ${{ steps.auftrag.outputs.run != '' && format('run {0}, artifact {1}', steps.auftrag.outputs.run, steps.auftrag.outputs.artifact) || format('commit {0}, {1}', steps.auftrag.outputs.commit, steps.auftrag.outputs.path) }}
        run: |
          set -o pipefail
          python3 -I -u tools/suhl/daten/zahlen.py --g "$RUNNER_TEMP/g" --out "$RUNNER_TEMP/aus/suhl/d/v$V" --area "$AREA" \
            --zensus "$RUNNER_TEMP/zensus" --report "$RUNNER_TEMP/zahlen_bericht.json" --g-from "$GFROM" 2>&1 | cut -c1-600 | tee "$RUNNER_TEMP/zahlen.log"
          du -sh "$RUNNER_TEMP/aus/suhl/d/v$V"
      - name: Prüfer des Datenvertrags
        env:
          AREA: ${{ steps.auftrag.outputs.area }}
        run: |
          set -o pipefail
          if [ "$AREA" = "probe" ]; then P="--probe"; else P=""; fi
          python3 -I -u tools/suhl/lib/validate.py "$RUNNER_TEMP/aus" $P --quiet --json "$RUNNER_TEMP/vertrag.json" 2>&1 | tail -30 | tee "$RUNNER_TEMP/vertrag.log"
      - name: Zusammenfassung
        if: always()
        run: |
          python3 -I - <<'PY' >> "$GITHUB_STEP_SUMMARY" || true
          import json, os
          t = os.environ['RUNNER_TEMP']
          r = json.load(open(os.path.join(t, 'zahlen_bericht.json')))
          s, z = r['stadt'], r.get('zensus', {})
          print(f"**Szenario-Zahlen** – {r['tiles']} Kacheln, {r['buildings']} Gebäude, {r['bytes'] / 1e6:.2f} MB + viertel.json {r['bytes_viertel'] / 1e3:.0f} kB; "
                f"aus g v{r['g_version']}")
          print()
          print(f"- in der Gemeinde: Grundfläche {s['footprint'] / 1e4:.1f} ha, Geschossfläche {s['floorArea'] / 1e4:.1f} ha, Dächer {s['roofArea'] / 1e4:.1f} ha, "
                f"Solar-Potenzial {s['pvKwp'] / 1e3:.1f} MWp (Regel)")
          if z:
              c = z['city']
              print(f"- Zensus 2022: {c['residents']} Einwohner in {c['cells']} Zellen; auf Gebäude verteilt {z['residents_on_buildings']:.0f}, "
                    f"ohne Gebäude {z['residents_unassigned']}")
          print(f"- Dachrichtungen hier gegen g (Grad, 5 %/Mitte/95 %): {r['roof_check']['az_here_minus_g_deg_p5_p50_p95']}")
          print()
          print('| Stadtteil | Gebäude | Geschossfläche ha | Einwohner Stadt 31.12.2022 | Zensus 2022 | Modell |')
          print('|---|---|---|---|---|---|')
          for k, v in r['viertel'].items():
              print(f"| {k} | {v['buildings']} | {v['floorArea'] / 1e4:.1f} | {v['official']['residents']} | {(v.get('census') or {}).get('residents', '–')} | "
                    f"{(v.get('residents') or {}).get('model', '–')} |")
          PY
      - name: Artefakt – der Versionsordner für die eine Tür
        uses: actions/upload-artifact@v4
        with:
          name: suhl-d-v${{ steps.auftrag.outputs.version }}
          path: ${{ runner.temp }}/aus/suhl/d/v${{ steps.auftrag.outputs.version }}
          retention-days: 30
          if-no-files-found: error
      - name: Artefakt – Bericht, Protokolle, Zensus-Zellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suhl-zahlen-bericht
          path: |
            ${{ runner.temp }}/zahlen_bericht.json
            ${{ runner.temp }}/vertrag.json
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/zensus
          retention-days: 30
