# feat/welt-dinge: the car parks of OpenStreetMap (amenity=parking) and what they belong to (supermarket, church, school …) for the
# areas of the parked cars – Overpass is not reachable from the chat machine. Runs when the script changes; the result is the artifact
# 'osm-parkplaetze' (gh run download <id> -n osm-parkplaetze), nothing is pushed or published.
name: Welt-Dinge – OSM-Parkplätze

on:
  push:
    branches: ['feat/welt-dinge']
    paths: ['tools/welt-dinge/osm_parkplaetze.py', '.github/workflows/welt-dinge-osm.yml']

concurrency:
  group: welt-dinge-osm
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  osm:
    name: Overpass
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parkplätze und Orte holen
        run: python -u tools/welt-dinge/osm_parkplaetze.py "$RUNNER_TEMP/osm_parkplaetze.json"
      - uses: actions/upload-artifact@v4
        with:
          name: osm-parkplaetze
          path: ${{ runner.temp }}/osm_parkplaetze.json
          retention-days: 5
