# Welt (Woche 1): Testblock um den Garten – Geodaten laden, Kacheln bauen, Straßen glätten, Viewer im Browser prüfen,
# nach gh-pages/welt-test/ veröffentlichen (nur dieser Ordner; die Website und plan.json bleiben unberührt).
#   Pipeline: tools/welt/build.py · Viewer: viz3/welt-viewer/ · Prüfung: tools/welt/check_viewer.py
#   Ergebnis: https://mynametouse.github.io/pavillon-ratscher/welt-test/viewer/
name: Welt-Testblock

on:
  workflow_dispatch:
    inputs:
      plan:
        description: 'Umfang: A = 4 × 4 km Detail (Stufe 12) + 4,8 km Block; B = dazu Block 9,6 × 9,6 km (Stufen 8–11)'
        type: choice
        options: [A, B]
        default: B
      veroeffentlichen:
        description: 'nach gh-pages/welt-test/ veröffentlichen'
        type: boolean
        default: true
  push:
    branches: ['welt/**']
    paths: ['tools/welt/**', 'viz3/welt-viewer/**', '.github/workflows/welt-testblock.yml']

permissions:
  contents: write

env:
  PLAN: ${{ inputs.plan || 'B' }}

jobs:
  build:
    name: Kacheln bauen und prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 150
    concurrency:
      group: welt-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Werkzeuge
        run: pip install --quiet numpy scipy shapely pyproj pillow tifffile imagecodecs requests mapbox-earcut rasterio playwright
      - name: Kurztests der Pipeline (Sekunden)
        run: python -I tools/welt/test_welt.py
      - name: Rohdaten aus dem Cache (Downloads früherer Läufe)
        uses: actions/cache/restore@v4
        with:
          path: ~/welt-raw
          key: welt-raw-${{ env.PLAN }}-v1-${{ github.run_id }}
          restore-keys: |
            welt-raw-${{ env.PLAN }}-v1-
            welt-raw-
      - name: Pipeline (Laden, Gelände, Straßen, Luftbild, Gebäude)
        run: |
          set -o pipefail
          python -I -u tools/welt/build.py --plan "$PLAN" --raw ~/welt-raw --out site/welt-test 2>&1 | tee build.log
      - name: Rohdaten in den Cache (auch wenn später etwas scheitert)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/welt-raw
          key: welt-raw-${{ env.PLAN }}-v1-${{ github.run_id }}
      - name: Zusammenfassung
        if: always()
        run: |
          [ -f build.log ] || exit 0
          {
            echo "### Welt-Testblock Plan $PLAN"
            echo '```'
            grep -E "Straßen|Wellen|^   [a-z]|Gelände an|Gebäude:|DEM source|fertig in|Stufe" build.log | head -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Viewer dazu
        run: |
          mkdir -p site/welt-test/viewer
          cp viz3/welt-viewer/* site/welt-test/viewer/
          du -sh site/welt-test; find site/welt-test -type f | wc -l
      - name: 3D-Tiles-Validator (Straßen, Gebäude)
        continue-on-error: true
        run: |
          for t in r b; do
            [ -f "site/welt-test/$t/tileset.json" ] || continue
            npx --yes 3d-tiles-validator --tilesetFile "site/welt-test/$t/tileset.json" --writeReports false > "val_$t.json" 2>&1 || true
            python3 -c "import json,sys; d=json.load(open('val_$t.json')); n=d.get('numErrors'); w=d.get('numWarnings'); print('$t', 'Fehler', n, 'Warnungen', w); [print(' ', i.get('type'), i.get('message','')[:160]) for i in d.get('issues', [])[:8]]" || tail -20 "val_$t.json"
          done
      - name: Browser für die Prüfung
        run: |
          # the system packages come from the Ubuntu mirror, which sometimes stalls: bounded, then the browser alone
          timeout 90 python -m playwright install --with-deps chromium || python -m playwright install chromium
      - name: Prüfen im Browser (Chromium, Software-Grafik)
        run: python -I tools/welt/check_viewer.py site --out check
      - name: Prüfausgabe aufheben
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: welt-pruefung
          path: |
            check/
            build.log
          if-no-files-found: ignore
      - name: Kacheln für die Veröffentlichung
        uses: actions/upload-artifact@v4
        with:
          name: welt-test
          path: site/welt-test
          retention-days: 3
          compression-level: 0

  deploy:
    name: Nach gh-pages/welt-test/
    needs: build
    if: github.event_name == 'push' || inputs.veroeffentlichen
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    outputs:
      generated: ${{ steps.push.outputs.generated }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: welt-test
          path: new/welt-test
      - name: Größe prüfen (Grenze 300 MB)
        run: |
          MB=$(du -sm new/welt-test | cut -f1); echo "welt-test: $MB MB"
          [ "$MB" -lt 300 ] || { echo "zu groß für gh-pages"; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: welt-test
      - name: Nur welt-test/ ersetzen, committen, pushen (bei Wettlauf neu aufsetzen)
        id: push
        working-directory: pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          apply() { rm -rf welt-test && cp -r ../new/welt-test welt-test && git add -A welt-test; }
          apply
          if git diff --cached --quiet; then echo "keine Änderung"; echo "generated=$(python3 -c "import json;print(json.load(open('welt-test/meta.json'))['generated'])")" >> "$GITHUB_OUTPUT"; exit 0; fi
          MSG="Welt-Testkacheln: Plan $PLAN aus ${GITHUB_SHA::7} (${GITHUB_REF_NAME})

          Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01GdUYaP2XXAAEDXZpGWVkBm"
          git commit -q -m "$(echo "$MSG" | sed 's/^          //')"
          for i in 1 2 3 4 5; do
            if git push -q origin HEAD:gh-pages; then echo "gepusht"; break; fi
            echo "Push abgelehnt (Versuch $i) – neu holen und den eigenen Commit darauf setzen"
            git fetch -q --depth 1 --filter=blob:none origin gh-pages
            if ! git rebase -q --onto FETCH_HEAD HEAD~1; then
              git rebase --abort || true
              git reset -q --hard FETCH_HEAD
              apply
              git commit -q -m "$(echo "$MSG" | sed 's/^          //')"
            fi
            [ "$i" = 5 ] && exit 1
            sleep $((i * 7))
          done
          git log --oneline -2
          echo "generated=$(python3 -c "import json;print(json.load(open('welt-test/meta.json'))['generated'])")" >> "$GITHUB_OUTPUT"

  r2:
    # later home of the world tiles: Cloudflare R2 (S3 API). Inert until Falko adds the secrets R2_ACCOUNT_ID, R2_ACCESS_KEY_ID,
    # R2_SECRET_ACCESS_KEY, R2_BUCKET (and makes the bucket public with CORS for mynametouse.github.io).
    name: Nach Cloudflare R2 (wenn eingerichtet)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_DEFAULT_REGION: auto
    steps:
      - name: R2 eingerichtet?
        run: '[ -n "$R2_ACCOUNT_ID" ] && echo "R2: ja" || echo "R2 noch nicht eingerichtet – nichts zu tun"'
      - uses: actions/download-artifact@v4
        if: env.R2_ACCOUNT_ID != ''
        with:
          name: welt-test
          path: new/welt-test
      - name: Hochladen (nur Geändertes)
        if: env.R2_ACCOUNT_ID != ''
        run: |
          aws s3 sync new/welt-test "s3://$R2_BUCKET/welt-test" --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --no-progress --exclude "*.glb" --exclude "*.bin"
          aws s3 sync new/welt-test "s3://$R2_BUCKET/welt-test" --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --no-progress --exclude "*" --include "*.glb" --content-type model/gltf-binary
          aws s3 sync new/welt-test "s3://$R2_BUCKET/welt-test" --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --no-progress --exclude "*" --include "*.bin" --content-type application/octet-stream

  live:
    name: Live-Prüfung (GitHub Pages)
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Auf die neue Fassung warten
        env:
          GEN: ${{ needs.deploy.outputs.generated }}
        run: |
          for i in $(seq 1 40); do
            G=$(curl -fsS "https://mynametouse.github.io/pavillon-ratscher/welt-test/meta.json?$i" | python3 -c "import json,sys;print(json.load(sys.stdin)['generated'])" || true)
            echo "live: $G  erwartet: $GEN"; [ "$G" = "$GEN" ] && exit 0; sleep 20
          done
          echo "noch nicht live – prüfe trotzdem"
      - name: Prüfen im Browser (live)
        run: |
          pip install --quiet playwright
          timeout 90 python -m playwright install --with-deps chromium || python -m playwright install chromium
          python -I tools/welt/check_viewer.py . --url "https://mynametouse.github.io/pavillon-ratscher/welt-test/viewer/" --out check-live
      - name: Prüfausgabe aufheben
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: welt-pruefung-live
          path: check-live/
          if-no-files-found: ignore
