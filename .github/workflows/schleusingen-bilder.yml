# Schleusingen (feat/schleusingen): only its own browser test, quickly – pictures of the town for the agent while feat.yml runs every
# merged feature's test. Same setup as feat.yml (website as asset base, extras), artifact 'schleusingen-out'.
name: Schleusingen-Bilder

on:
  push:
    branches: ['feat/schleusingen']
    paths: ['viz3/src/welt/**', 'viz3/test/schleusingen.py', 'viz3/extra/schleusingen/**', 'tools/welt/zone_schleusingen.py', '.github/workflows/schleusingen-bilder.yml']

concurrency:
  group: schleusingen-bilder-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Schleusingen im Browser
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Website als Asset-Basis
        run: |
          git clone -q --depth 1 --filter=blob:none --no-checkout --branch gh-pages --single-branch "https://github.com/${{ github.repository }}" "$RUNNER_TEMP/site"
          cd "$RUNNER_TEMP/site"
          if git cat-file -e HEAD:vorschau/index.html 2>/dev/null; then
            git sparse-checkout set --no-cone '/vorschau/'; B="$RUNNER_TEMP/site/vorschau"
          else
            git sparse-checkout set --no-cone '/*' '!/vorschau/' '!/welt-test/'; B="$RUNNER_TEMP/site"
          fi
          git checkout -q
          cd "$GITHUB_WORKSPACE"; mkdir -p viz3/dist
          (cd "$B" && tar --exclude=.git --exclude=./vorschau --exclude=./welt-test -cf - .) | (cd viz3/dist && tar -xf -)
      - name: Werkzeuge
        run: |
          npm ci --prefix viz3 --no-audit --no-fund
          pip install playwright
          timeout 300 python -m playwright install --with-deps chromium || python -m playwright install chromium
      - name: Bauen
        run: python viz3/build.py --fast --min
      - name: Schleusingen (Test und Bilder)
        run: python viz3/test/run.py --serve schleusingen
      - name: Bilder aufheben
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schleusingen-out
          path: out/
          if-no-files-found: ignore
          retention-days: 3
