# Suhl-Boden (Stufe 2 des Suhl-Plans, Paket S2-1, Auftrag docs/plans/auftraege/suhl-boden.md): Gelände und Luftbild der ganzen Stadt
# als Kacheln (Stufen 6–12, Kachel-Listen statt Rechtecke) – tools/suhl/boden/boden.py, aufgebaut auf tools/welt/ (nur importiert).
#   mode = stadt  die ganze Gemeinde und die Straßenkorridore Garten → Suhl; das Produkt bleibt als Artefakt suhl-boden-<version>
#                 und geht mit „veroeffentlichen = ja“ über die Aktion suhl-publish von suhl-daten ins Daten-Repo pavillon-daten
#   mode = probe  der Probesatz Zentrum; er wird nach tools/suhl/out/boden/probe/suhl/boden/<version>/ auf suhl/boden geschrieben
# Dazu: Kurztests, Prüfungen (Kanten, Listen, Größen, Mittelpunkt), Zahlen nach tools/suhl/out/boden/actions/<mode>/ auf suhl/boden,
# Bildbögen auf den Wegwerf-Zweig ref/suhl-boden. Sonst wird nichts angefasst; nichts geht nach gh-pages.
# DGM1 (1 m): jeder Lauf fragt zuerst die alte Landes-Adresse; mit dem Geheimnis EASYGEODATA_KEY danach easygeodata (Client von
# suhl-daten). Fehlt der Schlüssel oder der Client, steht das im Protokoll und in der Zusammenfassung – der Lauf schlägt nicht fehl.
# Läuft nur auf suhl/boden und nur, wenn diese Datei oder tools/suhl/boden/lauf.txt sich ändert (lauf.txt ändern = neuen Lauf
# bestellen). Der Lauf nimmt beim Start den neuesten Stand des Zweigs.
name: Suhl – Boden (Gelände und Luftbild)

on:
  push:
    branches: ['suhl/boden']
    paths: ['.github/workflows/suhl-boden.yml', 'tools/suhl/boden/lauf.txt']

concurrency:
  group: suhl-boden
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  boden:
    name: Kacheln bauen und prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      mode: ${{ steps.lauf.outputs.mode }}
      version: ${{ steps.lauf.outputs.version }}
      veroeffentlichen: ${{ steps.lauf.outputs.veroeffentlichen }}
      gebaut: ${{ steps.bau.outcome }}
    env:
      SUHL_RAW: /home/runner/suhl-boden-raw
    steps:
      - uses: actions/checkout@v4
        with:
          ref: suhl/boden
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Werkzeuge
        run: |
          pip install --quiet numpy scipy shapely pyproj pillow tifffile imagecodecs requests rasterio
          mkdir -p "$SUHL_RAW" logs results sheets
      - name: Bestellung lesen (tools/suhl/boden/lauf.txt)
        id: lauf
        run: |
          python3 - <<'EOF'
          import os, re
          kv = {}
          for ln in open('tools/suhl/boden/lauf.txt', encoding='utf-8'):
              ln = ln.split('#', 1)[0].strip()
              if '=' in ln:
                  k, v = ln.split('=', 1)
                  kv[k.strip()] = v.strip()
          mode = kv.get('mode', 'stadt')
          version = kv.get('version', 'v1')
          pub = kv.get('veroeffentlichen', 'nein')
          assert mode in ('stadt', 'probe') and re.fullmatch(r'v\d+', version) and pub in ('ja', 'nein'), kv
          for f in (os.environ['GITHUB_ENV'], os.environ['GITHUB_OUTPUT']):
              with open(f, 'a') as o:
                  o.write(f'MODE={mode}\nVERSION={version}\nPUBLISH={pub}\nmode={mode}\nversion={version}\nveroeffentlichen={pub}\n')
          print(kv)
          EOF
          echo "START=$(date +%s)" >> "$GITHUB_ENV"
      - name: Kurztests (Sekunden, ohne Netz)
        run: python -I tools/suhl/boden/test_boden.py
      - name: Rohdaten aus dem Cache (Downloads und Zwischenstände früherer Läufe)
        uses: actions/cache/restore@v4
        with:
          path: ~/suhl-boden-raw
          key: suhl-boden-raw-v1-${{ github.run_id }}
          restore-keys: |
            suhl-boden-raw-v1-
      - name: Boden bauen (Gelände in Blöcken, Luftbild vom WMS)
        id: bau
        timeout-minutes: 120
        env:
          EASYGEODATA_KEY: ${{ secrets.EASYGEODATA_KEY }}
        run: |
          set -o pipefail
          EXTRA=""
          if [ "$MODE" = probe ]; then EXTRA="--cut 1"; fi
          if [ -z "$EASYGEODATA_KEY" ]; then echo "Hinweis: das Geheimnis EASYGEODATA_KEY ist nicht gesetzt – DGM1 über easygeodata wird übersprungen."; fi
          python -I -u tools/suhl/boden/boden.py --mode "$MODE" --raw "$SUHL_RAW" --out "site/suhl/boden/$VERSION" --jobs 4 $EXTRA 2>&1 | tee logs/build.log
      - name: Inhalt der Rohdaten (neuer Cache nur, wenn etwas dazukam)
        if: always()
        run: echo "RAWKEY=$(cd "$SUHL_RAW" 2>/dev/null && find . -type f -printf '%P %s\n' | sort | sha1sum | cut -c1-16)" >> "$GITHUB_ENV"
      - name: Rohdaten in den Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/suhl-boden-raw
          key: suhl-boden-raw-v1-${{ env.RAWKEY }}
      - name: Prüfungen (Listen, Mittelpunkt, Kanten, Höhen, Größen)
        id: pruef
        if: ${{ always() && steps.bau.outcome == 'success' }}
        run: |
          set -o pipefail
          python -I -u tools/suhl/boden/pruefen.py --set "site/suhl/boden/$VERSION" --mode "$MODE" --json results/pruefen.json 2>&1 | tee logs/pruefen.log
      - name: Bildbögen
        if: ${{ always() && steps.bau.outcome == 'success' }}
        continue-on-error: true
        run: python -I tools/suhl/boden/bogen.py --set "site/suhl/boden/$VERSION" --out sheets --name "$MODE" 2>&1 | tee logs/bogen.log
      - name: Zahlen des Laufs
        if: always()
        run: |
          python -I tools/suhl/boden/lauf.py --set "site/suhl/boden/$VERSION" --mode "$MODE" --pruefen results/pruefen.json --raw "$SUHL_RAW" \
            --out results --summary "$GITHUB_STEP_SUMMARY" --seconds $(( $(date +%s) - START ))
          grep -E "DGM1|Kronenhöhe|Gelände:|Probesatz|fertig in|Stufe" logs/build.log | tail -40 || true
      - name: Ergebnisse nach suhl/boden (nur tools/suhl/out/boden/actions/ und im Modus probe der Probesatz)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p "tools/suhl/out/boden/actions/$MODE"
          cp -f results/*.json "tools/suhl/out/boden/actions/$MODE/" 2>/dev/null || true
          git add -f tools/suhl/out/boden/actions
          if [ "$MODE" = probe ] && [ -f "site/suhl/boden/$VERSION/meta.json" ] && [ "${{ steps.pruef.outcome }}" = success ]; then
            IMG=$(du -sb "site/suhl/boden/$VERSION/i" | cut -f1); TER=$(du -sb "site/suhl/boden/$VERSION/t" | cut -f1)
            echo "Probesatz: Luftbild $IMG Byte, Gelände $TER Byte"
            if [ "$IMG" -le 8000000 ] && [ "$TER" -le 3000000 ]; then
              rm -rf "tools/suhl/out/boden/probe/suhl/boden/$VERSION"
              mkdir -p tools/suhl/out/boden/probe/suhl/boden
              cp -r "site/suhl/boden/$VERSION" "tools/suhl/out/boden/probe/suhl/boden/$VERSION"
              git add -f -A "tools/suhl/out/boden/probe/suhl/boden/$VERSION"
            else
              echo "::warning::Probesatz zu groß für den Zweig (Luftbild höchstens 8 MB, Gelände höchstens 3 MB) – nur als Artefakt"
            fi
          fi
          if git diff --cached --quiet; then echo "keine Änderung"; exit 0; fi
          if git diff --cached --name-only | grep -v -e '^tools/suhl/out/boden/actions/' -e '^tools/suhl/out/boden/probe/' | grep -q .; then echo "fremde Pfade im Commit"; exit 1; fi
          printf '%s\n\n%s\n%s\n' "suhl-boden: results of the Actions run ${GITHUB_RUN_ID} (mode ${MODE}, ${VERSION})" \
            "Co-Authored-By: Claude Fable 5.2 <noreply@anthropic.com>" \
            "Claude-Session: https://claude.ai/code/session_01L6YrpcuzUozgpZNSC5CdVL" > "$RUNNER_TEMP/msg.txt"
          git commit -q -F "$RUNNER_TEMP/msg.txt"
          for i in 1 2 3 4 5; do
            if git pull -q --rebase origin suhl/boden && git push -q origin HEAD:suhl/boden; then echo "gepusht"; break; fi
            echo "Push abgelehnt (Versuch $i)"; sleep $((15 * i))
          done
      - name: Bildbögen auf den Wegwerf-Zweig ref/suhl-boden
        if: always()
        continue-on-error: true
        run: |
          if ls sheets/*.jpg >/dev/null 2>&1; then bash tools/suhl/boden/bilder.sh sheets "$MODE-$VERSION"; else echo "keine Bögen"; fi
      - name: Produkt als Artefakt (bis es im Daten-Repo liegt)
        if: ${{ always() && steps.bau.outcome == 'success' && env.MODE == 'stadt' }}
        uses: actions/upload-artifact@v4
        with:
          name: suhl-boden-${{ env.VERSION }}
          path: site/suhl/boden/${{ env.VERSION }}
          retention-days: 14
          compression-level: 0
      - name: Protokolle, Zahlen, Bögen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suhl-boden-pruefung
          path: |
            logs/
            results/
            sheets/
          if-no-files-found: ignore
          retention-days: 14

  veroeffentlichen:
    name: Ins Daten-Repo (Aktion suhl-publish von suhl-daten)
    needs: boden
    if: ${{ needs.boden.outputs.veroeffentlichen == 'ja' && needs.boden.outputs.mode == 'stadt' && needs.boden.outputs.gebaut == 'success' && needs.boden.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: suhl-daten-publish        # eine Gruppe für alle veröffentlichenden Jobs des Repos, nie abbrechen
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: suhl/boden
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: suhl-boden-${{ needs.boden.outputs.version }}
          path: pub/suhl/boden/${{ needs.boden.outputs.version }}
      - name: Veröffentlichen
        uses: ./.github/actions/suhl-publish
        with:
          folder: pub/suhl/boden/${{ needs.boden.outputs.version }}
          token: ${{ secrets.DATEN_TOKEN }}
          artifact: suhl-boden-${{ needs.boden.outputs.version }}-unveroeffentlicht
