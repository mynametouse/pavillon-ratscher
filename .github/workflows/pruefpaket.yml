# Prüfpaket bei jedem neuen Stand auf src und auf den Kern-Zweigen kern/* (Plan: Projektdokument claude/pavillon-umbau.md, Phase 0) – die
# langen Browser-Tests laufen hier gleichzeitig auf eigenen Rechnern statt nacheinander im Chat; nur src geht danach in die Vorschau:
#   Pflicht: smoke, gpu (16 Texturen je Shader), softgl (ohne Grafikkarte), loadlog (Laden mit gespeicherten Ständen), memphone (iPhone-Speicher),
#            savefuzz (kaputte gespeicherte Werte), Straßen (Wellen je km unter der Grenze)
#   Versuch: Safari-Engine (WebKit mit iPhone-13-Profil) – zählt noch nicht, bis klar ist, ob WebGL dort ohne Grafikkarte läuft;
#            Feature-Tests v16b, v16c, v16d, v16e – melden, halten die Vorschau aber noch nicht auf
#            Themen-Tests (seit 23.10.2026): jede Zeile von viz3/extra/*/tests.txt als eigener Lauf – ebenso nur melden
name: Prüfpaket

on:
  push:
    branches: [src, 'kern/**']
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

concurrency:
  group: pruefpaket-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser:
    name: ${{ matrix.test }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        test: [smoke, gpu, softgl, loadlog, memphone, savefuzz]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Website als Asset-Basis (Branch gh-pages, Vorschau wenn vorhanden)
        run: |
          # sparse: only the preview (or the site without preview and world tiles) – the full branch is ~400 MB (welt-test/, 23.10.2026)
          git clone -q --depth 1 --filter=blob:none --no-checkout --branch gh-pages --single-branch "https://github.com/${{ github.repository }}" "$RUNNER_TEMP/site"
          if git -C "$RUNNER_TEMP/site" cat-file -e HEAD:vorschau/index.html 2>/dev/null; then git -C "$RUNNER_TEMP/site" sparse-checkout set --no-cone '/vorschau/' '/tex2/'; B="$RUNNER_TEMP/site/vorschau"
          else git -C "$RUNNER_TEMP/site" sparse-checkout set --no-cone '/*' '!/vorschau/' '!/welt-test/'; B="$RUNNER_TEMP/site"; fi
          git -C "$RUNNER_TEMP/site" checkout -q
          mkdir -p viz3/dist
          (cd "$B" && tar --exclude=.git --exclude=./vorschau --exclude=./welt-test -cf - .) | (cd viz3/dist && tar -xf -)
          # KTX2 textures (texturen-ktx2.yml): only at the site root, the preview loads them from there
          if [ -d "$RUNNER_TEMP/site/tex2" ]; then rm -rf viz3/dist/tex2 && cp -r "$RUNNER_TEMP/site/tex2" viz3/dist/tex2; fi
      - name: Werkzeuge
        run: |
          npm ci --prefix viz3 --no-audit --no-fund
          pip install playwright
          # the system packages come from the Ubuntu mirror, which sometimes stalls: bounded, then the browser alone
          timeout 300 python -m playwright install --with-deps chromium || python -m playwright install chromium
      - name: Bauen wie veröffentlicht
        run: python viz3/build.py --fast --min
      - name: Test ${{ matrix.test }}
        run: python viz3/test/run.py --serve ${{ matrix.test }}
      - name: Testausgabe aufheben
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-${{ matrix.test }}
          path: out/
          if-no-files-found: ignore

  features:
    # die Feature-Tests (Fahrzeuge, Wald und Fällen, Holz, Dorf) – je 10–30 min, seit 23.10.2026 in Abschnitte geteilt (halbe Wartezeit);
    # sie melden, halten die Vorschau aber (noch) nicht auf
    name: Feature ${{ matrix.key }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { key: v16b-1, test: 'v16b:car,drive,crash,route' }
          - { key: v16b-2, test: 'v16b:walk,tractor,night,ui,phone' }
          - { key: v16c-1, test: 'v16c:stand,views,walk,season' }
          - { key: v16c-2, test: 'v16c:tractor,night,phone,fell' }
          - { key: v16d-1, test: 'v16d:trailer,bridge,load' }
          - { key: v16d-2, test: 'v16d:fork,saw,stack' }
          - { key: v16e-1, test: 'v16e:load,places,near,walk' }
          - { key: v16e-2, test: 'v16e:night,shots,gl' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Website als Asset-Basis (Branch gh-pages, Vorschau wenn vorhanden)
        run: |
          # sparse: only the preview (or the site without preview and world tiles) – the full branch is ~400 MB (welt-test/, 23.10.2026)
          git clone -q --depth 1 --filter=blob:none --no-checkout --branch gh-pages --single-branch "https://github.com/${{ github.repository }}" "$RUNNER_TEMP/site"
          if git -C "$RUNNER_TEMP/site" cat-file -e HEAD:vorschau/index.html 2>/dev/null; then git -C "$RUNNER_TEMP/site" sparse-checkout set --no-cone '/vorschau/' '/tex2/'; B="$RUNNER_TEMP/site/vorschau"
          else git -C "$RUNNER_TEMP/site" sparse-checkout set --no-cone '/*' '!/vorschau/' '!/welt-test/'; B="$RUNNER_TEMP/site"; fi
          git -C "$RUNNER_TEMP/site" checkout -q
          mkdir -p viz3/dist
          (cd "$B" && tar --exclude=.git --exclude=./vorschau --exclude=./welt-test -cf - .) | (cd viz3/dist && tar -xf -)
          # KTX2 textures (texturen-ktx2.yml): only at the site root, the preview loads them from there
          if [ -d "$RUNNER_TEMP/site/tex2" ]; then rm -rf viz3/dist/tex2 && cp -r "$RUNNER_TEMP/site/tex2" viz3/dist/tex2; fi
      - name: Werkzeuge
        run: |
          npm ci --prefix viz3 --no-audit --no-fund
          pip install playwright
          # the system packages come from the Ubuntu mirror, which sometimes stalls: bounded, then the browser alone
          timeout 300 python -m playwright install --with-deps chromium || python -m playwright install chromium
      - name: Bauen wie veröffentlicht
        run: python viz3/build.py --fast --min
      - name: Test ${{ matrix.key }}
        run: python viz3/test/run.py --serve '${{ matrix.test }}'
      - name: Testausgabe aufheben
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feature-${{ matrix.key }}
          path: out/
          if-no-files-found: ignore

  themen-liste:
    # the browser tests of the night's topics (garden, figures, neighbours, village, winch, trees …): one job per line of
    # viz3/extra/*/tests.txt ('name[:sections]' as for viz3/test/run.py) – so a merge on src also checks every topic against all the others
    name: Themen-Tests finden
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      m: ${{ steps.l.outputs.m }}
      n: ${{ steps.l.outputs.n }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: viz3/extra
      - id: l
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import glob, json, re
          inc = []
          for f in sorted(glob.glob('viz3/extra/*/tests.txt')):
              for ln in open(f):
                  ln = ln.split('#', 1)[0].strip()
                  if ln: inc.append({'key': re.sub(r'[^A-Za-z0-9_-]+', '-', ln).strip('-')[:40], 'test': ln})
          print('m=' + json.dumps({'include': inc}))
          print('n=%d' % len(inc))
          EOF

  themen:
    name: Thema ${{ matrix.key }}
    needs: themen-liste
    if: needs.themen-liste.outputs.n != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.themen-liste.outputs.m) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Website als Asset-Basis (Branch gh-pages, Vorschau wenn vorhanden)
        run: |
          git clone -q --depth 1 --filter=blob:none --no-checkout --branch gh-pages --single-branch "https://github.com/${{ github.repository }}" "$RUNNER_TEMP/site"
          if git -C "$RUNNER_TEMP/site" cat-file -e HEAD:vorschau/index.html 2>/dev/null; then git -C "$RUNNER_TEMP/site" sparse-checkout set --no-cone '/vorschau/' '/tex2/'; B="$RUNNER_TEMP/site/vorschau"
          else git -C "$RUNNER_TEMP/site" sparse-checkout set --no-cone '/*' '!/vorschau/' '!/welt-test/'; B="$RUNNER_TEMP/site"; fi
          git -C "$RUNNER_TEMP/site" checkout -q
          mkdir -p viz3/dist
          (cd "$B" && tar --exclude=.git --exclude=./vorschau --exclude=./welt-test -cf - .) | (cd viz3/dist && tar -xf -)
          # KTX2 textures (texturen-ktx2.yml): only at the site root, the preview loads them from there
          if [ -d "$RUNNER_TEMP/site/tex2" ]; then rm -rf viz3/dist/tex2 && cp -r "$RUNNER_TEMP/site/tex2" viz3/dist/tex2; fi
      - name: Werkzeuge
        run: |
          npm ci --prefix viz3 --no-audit --no-fund
          pip install playwright
          timeout 300 python -m playwright install --with-deps chromium || python -m playwright install chromium
      - name: Bauen wie veröffentlicht
        run: python viz3/build.py --fast --min
      - name: Test ${{ matrix.test }}
        run: python viz3/test/run.py --serve '${{ matrix.test }}'
      - name: Testausgabe aufheben
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thema-${{ matrix.key }}
          path: out/
          if-no-files-found: ignore

  webkit:
    name: Safari-Engine (Versuch)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Website als Asset-Basis
        run: |
          # sparse: only the preview (or the site without preview and world tiles) – the full branch is ~400 MB (welt-test/, 23.10.2026)
          git clone -q --depth 1 --filter=blob:none --no-checkout --branch gh-pages --single-branch "https://github.com/${{ github.repository }}" "$RUNNER_TEMP/site"
          if git -C "$RUNNER_TEMP/site" cat-file -e HEAD:vorschau/index.html 2>/dev/null; then git -C "$RUNNER_TEMP/site" sparse-checkout set --no-cone '/vorschau/' '/tex2/'; B="$RUNNER_TEMP/site/vorschau"
          else git -C "$RUNNER_TEMP/site" sparse-checkout set --no-cone '/*' '!/vorschau/' '!/welt-test/'; B="$RUNNER_TEMP/site"; fi
          git -C "$RUNNER_TEMP/site" checkout -q
          mkdir -p viz3/dist
          (cd "$B" && tar --exclude=.git --exclude=./vorschau --exclude=./welt-test -cf - .) | (cd viz3/dist && tar -xf -)
          # KTX2 textures (texturen-ktx2.yml): only at the site root, the preview loads them from there
          if [ -d "$RUNNER_TEMP/site/tex2" ]; then rm -rf viz3/dist/tex2 && cp -r "$RUNNER_TEMP/site/tex2" viz3/dist/tex2; fi
      - name: Werkzeuge
        run: |
          npm ci --prefix viz3 --no-audit --no-fund
          pip install playwright
          # the system packages come from the Ubuntu mirror, which sometimes stalls: bounded, then the browser alone
          # WebKit cannot start without its system packages (the fallback without them ended in a traceback after 1 s). The package mirror
          # sometimes needs more than 5 min, and a second try only finds apt still holding its lock – so one try with time enough
          timeout --kill-after=30 900 python -m playwright install --with-deps webkit || echo "Systempakete für WebKit nicht vollständig"
          python -m playwright install webkit
      - name: Bauen wie veröffentlicht
        run: python viz3/build.py --fast --min
      - name: WebKit mit iPhone-13-Profil
        run: python viz3/test/run.py --serve webkit

  strassen:
    name: Straßen glatt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gelände der Website (Vorschau wenn vorhanden)
        run: |
          # sparse: only the preview (or the site without preview and world tiles) – the full branch is ~400 MB (welt-test/, 23.10.2026)
          git clone -q --depth 1 --filter=blob:none --no-checkout --branch gh-pages --single-branch "https://github.com/${{ github.repository }}" "$RUNNER_TEMP/site"
          if git -C "$RUNNER_TEMP/site" cat-file -e HEAD:vorschau/index.html 2>/dev/null; then git -C "$RUNNER_TEMP/site" sparse-checkout set --no-cone '/vorschau/'; B="$RUNNER_TEMP/site/vorschau"
          else git -C "$RUNNER_TEMP/site" sparse-checkout set --no-cone '/*' '!/vorschau/' '!/welt-test/'; B="$RUNNER_TEMP/site"; fi
          git -C "$RUNNER_TEMP/site" checkout -q
          echo "GEO=$B/geo" >> "$GITHUB_ENV"
      - name: Wellen je km messen
        run: |
          pip install numpy scipy
          # what the build will use: an extra's terrain (viz3/extra/<thema>/dist/geo/, e.g. fahrt's repaired roads) lies over the site's, as in build.py
          cp viz3/extra/*/dist/geo/terrain.b64.json "$GEO"/ 2>/dev/null || true
          python -I tools/geo/smooth_roads.py "$GEO" viz3/manifests.json "$RUNNER_TEMP/roads" --measure

  vorschau:
    name: Vorschau veröffentlichen
    needs: [browser, strassen]
    # nur src geht in die Vorschau – die Kern-Zweige (kern/*) werden nur geprüft
    if: github.ref == 'refs/heads/src'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Website holen (Branch gh-pages)
        run: |
          git clone -q --depth 1 --branch gh-pages --single-branch "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "$RUNNER_TEMP/site"
          mkdir -p viz3/dist
          B="$RUNNER_TEMP/site"; [ -f "$B/vorschau/index.html" ] && B="$B/vorschau"
          (cd "$B" && tar --exclude=.git --exclude=./vorschau --exclude=./welt-test -cf - .) | (cd viz3/dist && tar -xf -)
          # KTX2 textures (texturen-ktx2.yml): the site's tex2/ for the build (TEX2MAN); deploy_site.py does not copy it, the preview loads it from the root
          if [ -d "$RUNNER_TEMP/site/tex2" ]; then rm -rf viz3/dist/tex2 && cp -r "$RUNNER_TEMP/site/tex2" viz3/dist/tex2; fi
      - name: Bauen wie veröffentlicht
        run: |
          npm ci --prefix viz3 --no-audit --no-fund
          python viz3/build.py --fast --min
          rm -rf viz3/dist_pub && cp -a viz3/dist viz3/dist_pub
      - name: Nach /vorschau/ schreiben und hochladen
        run: |
          python viz3/deploy_site.py dist_pub "$RUNNER_TEMP/site" vorschau
          cd "$RUNNER_TEMP/site"
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Vorschau: ${GITHUB_SHA::7} $(git -C "$GITHUB_WORKSPACE" log -1 --format=%s | cut -c1-90)" || { echo "nichts geändert"; exit 0; }
          for i in 1 2 3; do git push -q origin HEAD:gh-pages && break; git pull -q --rebase origin gh-pages; done
          echo "Vorschau: https://mynametouse.github.io/pavillon-ratscher/vorschau/"
