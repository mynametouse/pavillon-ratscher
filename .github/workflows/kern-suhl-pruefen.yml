# Falko 13.11.2026 18:46: "brich bitte alle ab, die nicht mehr nötig sind, damit alles online gehen kann" – the session token may not
# cancel runs (403), a run in the same concurrency group with cancel-in-progress does. Ends the superseded run in group check-refs/heads/kern/suhl.
name: Stopp kern-suhl-pruefen
on:
  push:
    branches: ['stopp/**']
concurrency:
  group: check-refs/heads/kern/suhl
  cancel-in-progress: true
jobs:
  stopp:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "superseded run in group check-refs/heads/kern/suhl ended (Falko 18:46)"
