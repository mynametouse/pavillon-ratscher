# Suhl-Straßen (Stufe 2 des Suhl-Plans, Paket S2-3, Auftrag docs/plans/auftraege/suhl-strassen.md): die ganze Stadt – jede Straße und jeder
# Weg der Gemeinde aus dem Geofabrik-Auszug Thüringen (mit osmium geschnitten), Längsprofile in einer Ausgleichsrechnung (Kreuzungen auf
# einer Höhe), Wasser und Bahn als eigene Ebenen, die zwei Routen Garten – Suhl, die Ausstattung, die Prüfungen.
# Ergebnis: Kacheln suhl/s/v0/… und suhl/m/v0/… und die Datei im Format der Fahrtdaten als Artefakt „suhl-strassen-stadt“ (bis es das
# Daten-Repo gibt); auf den Zweig kommen nur kleine Dateien nach tools/suhl/out/strassen/stadt/ (Zahlen, Index, die Profile als
# fahrt/suhl.json.gz für suhl-boden). Sonst wird nichts angefasst.
# Läuft nur auf suhl/strassen und nur, wenn diese Datei oder tools/suhl/strassen/lauf.txt sich ändert (lauf.txt ändern = neuen Lauf
# bestellen). Der Lauf nimmt beim Start den neuesten Stand des Zweigs; Skript-Änderungen allein stoßen keinen Lauf an.
name: Suhl – Straßen (ganze Stadt)

on:
  push:
    branches: ['suhl/strassen']
    paths: ['.github/workflows/suhl-strassen.yml', 'tools/suhl/strassen/lauf.txt']

concurrency:
  group: suhl-strassen
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  stadt:
    name: Straßennetz, Profile, Wasser, Bahn, Routen, Ausstattung, Prüfungen
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUHL_RAW: /home/runner/suhl-raw
      UA: 'PavillonRatscher-Suhl/0.1 (+https://github.com/mynametouse/pavillon-ratscher)'
      OUT: out/stadt
    steps:
      - uses: actions/checkout@v4
        with:
          ref: suhl/strassen
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Werkzeuge
        run: |
          pip install --quiet numpy scipy shapely pyproj rasterio tifffile imagecodecs pillow
          sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
          mkdir -p "$SUHL_RAW" logs "$OUT" tools/suhl/out/strassen/stadt
      - name: Rohdaten aus dem Cache (Downloads früherer Läufe)
        uses: actions/cache/restore@v4
        with:
          path: ~/suhl-raw
          key: suhl-strassen-raw-v1-${{ github.run_id }}
          restore-keys: |
            suhl-strassen-raw-v1-
      - name: OpenStreetMap – Geofabrik-Auszug Thüringen, auf Suhl und die Anfahrt vom Garten geschnitten (OPL)
        timeout-minutes: 15
        run: |
          set -o pipefail
          mkdir -p "$SUHL_RAW/geofabrik"
          P="$SUHL_RAW/geofabrik/suhl-strassen.opl.gz"
          # a cut older than a week is fetched again
          find "$SUHL_RAW/geofabrik" -name 'suhl-strassen.opl.gz' -mtime +7 -delete
          if [ ! -s "$P" ]; then
            curl -sSfL --retry 3 --retry-delay 20 -A "$UA" -o "$RUNNER_TEMP/th.osm.pbf" https://download.geofabrik.de/europe/germany/thueringen-latest.osm.pbf
            osmium fileinfo "$RUNNER_TEMP/th.osm.pbf" | grep -E "timestamp|Bounding|osmosis_replication_timestamp" | tee "$SUHL_RAW/geofabrik/fileinfo-strassen.txt"
            # the municipality (tiles of level 10 touching it, + 300 m) and the two routes from the garden (50.4991 N, 10.7692 E)
            osmium extract -b 10.53,50.485,10.87,50.705 -s smart "$RUNNER_TEMP/th.osm.pbf" -o "$RUNNER_TEMP/suhl.osm.pbf"
            osmium cat "$RUNNER_TEMP/suhl.osm.pbf" -f opl | gzip -6 > "$P"
            rm -f "$RUNNER_TEMP/th.osm.pbf" "$RUNNER_TEMP/suhl.osm.pbf"
          fi
          ls -la "$SUHL_RAW/geofabrik"
          cat "$SUHL_RAW/geofabrik/fileinfo-strassen.txt" || true
      - name: Geländekacheln von suhl-boden, falls es sie schon gibt (sonst Copernicus GLO-30)
        continue-on-error: true
        run: |
          # suhl-boden keeps its tiles as a workflow artifact until the data repo exists; a later version of this step fetches them.
          # Until then the profiles are solved on Copernicus GLO-30 with the forest lowered (tools/welt/dem.py CopGround).
          echo "Geländekacheln: keine – Profile auf Copernicus GLO-30" | tee logs/hoehen.txt
      - name: Die ganze Stadt – Straßen und Wege, Profile, Flächen, Wasser, Bahn (Kacheln s, Datei im Format der Fahrtdaten)
        timeout-minutes: 30
        run: |
          set -o pipefail
          python -I -u tools/suhl/strassen/lauf.py --gebiet stadt --opl "$SUHL_RAW/geofabrik/suhl-strassen.opl.gz" --raw "$SUHL_RAW" --out "$OUT" 2>&1 | tee logs/lauf.log
      - name: Die zwei Routen Garten – Suhl (Landstraße; Autobahn über die Anschlussstelle Suhl-Zentrum)
        continue-on-error: true
        timeout-minutes: 15
        run: |
          set -o pipefail
          if [ -f tools/suhl/strassen/routen.py ]; then
            python -I -u tools/suhl/strassen/routen.py --opl "$SUHL_RAW/geofabrik/suhl-strassen.opl.gz" --raw "$SUHL_RAW" --out "$OUT" 2>&1 | tee logs/routen.log
          else echo "routen.py fehlt noch – übersprungen" | tee logs/routen.log; fi
      - name: Ausstattung (Werkzeug des Straßen-Chats von feat/strassen, dazu Ampeln, Überwege, Haltestellen, Laternen, Straßenschilder)
        continue-on-error: true
        timeout-minutes: 15
        run: |
          set -o pipefail
          if [ -f tools/suhl/strassen/moebel.py ]; then
            git fetch -q --depth 1 origin feat/strassen && git show FETCH_HEAD:viz3/extra/strassen/daten.py > "$RUNNER_TEMP/daten.py" && git rev-parse FETCH_HEAD | tee logs/feat-strassen.txt
            python -I -u tools/suhl/strassen/moebel.py --opl "$SUHL_RAW/geofabrik/suhl-strassen.opl.gz" --daten "$RUNNER_TEMP/daten.py" --out "$OUT" 2>&1 | tee logs/moebel.log
          else echo "moebel.py fehlt noch – übersprungen" | tee logs/moebel.log; fi
      - name: Prüfungen (kein Haus in der Fahrbahn, Kreuzungen eben, Profile je Klasse, Zählung gegen bestand.json)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          set -o pipefail
          if [ -f tools/suhl/strassen/pruefen.py ]; then
            python -I -u tools/suhl/strassen/pruefen.py --opl "$SUHL_RAW/geofabrik/suhl-strassen.opl.gz" --out "$OUT" 2>&1 | tee logs/pruefen.log
          else echo "pruefen.py fehlt noch – übersprungen" | tee logs/pruefen.log; fi
      - name: Veröffentlichen ins Daten-Repo (nur mit DATEN_TOKEN und der Aktion von suhl-daten)
        continue-on-error: true
        env:
          DATEN_TOKEN: ${{ secrets.DATEN_TOKEN }}
        run: |
          if [ -z "$DATEN_TOKEN" ] || [ ! -d .github/actions/suhl-publish ]; then
            echo "Veröffentlichen übersprungen: DATEN_TOKEN oder die Aktion suhl-publish fehlt noch – die Kacheln bleiben als Artefakt." | tee logs/publish.txt
          else
            echo "DATEN_TOKEN und suhl-publish sind da – der Aufruf folgt, sobald suhl-daten die Aktion freigibt." | tee logs/publish.txt
          fi
      - name: Kleine Ergebnisse für den Zweig zusammenstellen
        if: always()
        run: |
          D=tools/suhl/out/strassen/stadt
          mkdir -p "$D/fahrt" "$D/suhl/s/v0" "$D/suhl/m/v0"
          cp -f "$OUT/zahlen.json" "$D/" 2>/dev/null || true
          cp -f "$OUT"/*.json "$D/" 2>/dev/null || true
          cp -f "$OUT/suhl/s/v0/index.json" "$D/suhl/s/v0/" 2>/dev/null || true
          cp -f "$OUT/suhl/m/v0/index.json" "$D/suhl/m/v0/" 2>/dev/null || true
          for f in "$OUT"/fahrt/*.json; do [ -f "$f" ] && gzip -9 -n -c "$f" > "$D/fahrt/$(basename "$f").gz"; done
          cp -f "$SUHL_RAW/geofabrik/fileinfo-strassen.txt" "$D/osm-stand.txt" 2>/dev/null || true
          echo "run ${GITHUB_RUN_ID} $(date -u +%FT%TZ)" > "$D/lauf.txt"
          find "$D" -type f -size +4500k -print -delete
          du -sh "$OUT" "$D" || true
          find "$D" -type f -printf '%s %p\n' | sort -k2
      - name: Inhalt der Rohdaten (neuer Cache nur, wenn etwas dazukam)
        if: always()
        run: echo "RAWKEY=$(cd "$SUHL_RAW" 2>/dev/null && find . -type f -printf '%P %s\n' | sort | sha1sum | cut -c1-16)" >> "$GITHUB_ENV"
      - name: Rohdaten in den Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/suhl-raw
          key: suhl-strassen-raw-v1-${{ env.RAWKEY }}
      - name: Die ganze Stadt als Artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suhl-strassen-stadt
          path: |
            out/stadt/
            logs/
          if-no-files-found: ignore
          retention-days: 14
      - name: Ergebnisse nach suhl/strassen (nur tools/suhl/out/strassen/stadt/)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f tools/suhl/out/strassen/stadt
          if git diff --cached --quiet; then echo "keine Änderung"; exit 0; fi
          if git diff --cached --name-only | grep -v '^tools/suhl/out/strassen/stadt/' | grep -q .; then echo "fremde Pfade im Commit"; exit 1; fi
          printf '%s\n\n%s\n%s\n' "suhl-strassen: results of the Actions run ${GITHUB_RUN_ID} (the whole city: numbers, index, the profiles as fahrt/suhl.json.gz)" \
            "Co-Authored-By: Claude Fable 5.2 <noreply@anthropic.com>" \
            "Claude-Session: https://claude.ai/code/session_01L6YrpcuzUozgpZNSC5CdVL" > "$RUNNER_TEMP/msg.txt"
          git commit -q -F "$RUNNER_TEMP/msg.txt"
          for i in 1 2 3 4 5; do
            if git pull -q --rebase origin suhl/strassen && git push -q origin HEAD:suhl/strassen; then echo "gepusht"; break; fi
            echo "Push abgelehnt (Versuch $i)"; sleep $((15 * i))
          done
