# Prüfen bei jedem Push (Plan: Projektdokument claude/pavillon-umbau.md, Phase 0):
#   1. Schnellprüfung ohne Browser – bash tools/check.sh (Build, Lint mit Datei/Zeile, Testskripte, Format-Bericht, Abhängigkeiten)
#   2. Kurztest im Browser – python3 viz3/test/run.py --serve smoke (Chromium mit Software-Grafik wie in den Chats)
# Lokal dasselbe mit denselben Befehlen. Reine Doku-Commits (docs/, *.md, z. B. PARALLEL.md) lösen nichts aus.
name: Prüfen

on:
  push:
    branches: [src, 'kern/**', 'feat/**', 'fix/**', 'perf/**', 'welt/**']
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    branches: [src]
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Schnellprüfung
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build, Lint, Testskripte, Format, Abhängigkeiten
        run: bash tools/check.sh

  smoke:
    name: Kurztest im Browser
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Website als Asset-Basis (Branch gh-pages)
        run: |
          # sparse: only the preview (or the site without preview and world tiles); the preview is built from src and may carry assets the
          # live site does not have yet
          git clone -q --depth 1 --filter=blob:none --no-checkout --branch gh-pages --single-branch "https://github.com/${{ github.repository }}" "$RUNNER_TEMP/site"
          if git -C "$RUNNER_TEMP/site" cat-file -e HEAD:vorschau/index.html 2>/dev/null; then git -C "$RUNNER_TEMP/site" sparse-checkout set --no-cone '/vorschau/'; B="$RUNNER_TEMP/site/vorschau"
          else git -C "$RUNNER_TEMP/site" sparse-checkout set --no-cone '/*' '!/vorschau/' '!/welt-test/'; B="$RUNNER_TEMP/site"; fi
          git -C "$RUNNER_TEMP/site" checkout -q
          mkdir -p viz3/dist
          (cd "$B" && tar --exclude=.git --exclude=./vorschau --exclude=./welt-test -cf - .) | (cd viz3/dist && tar -xf -)
      - name: Werkzeuge
        run: |
          npm ci --prefix viz3 --no-audit --no-fund
          pip install playwright
          # the system packages come from the Ubuntu mirror, which sometimes stalls: bounded, then the browser alone
          timeout 300 python -m playwright install --with-deps chromium || python -m playwright install chromium
      - name: Bauen wie veröffentlicht
        run: python viz3/build.py --fast --min
      - name: Kurztest
        run: python viz3/test/run.py --serve smoke
      - name: Testausgabe aufheben
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testausgabe
          path: out/run/
          if-no-files-found: ignore
