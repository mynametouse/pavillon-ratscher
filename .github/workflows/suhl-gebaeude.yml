# Suhl-Gebäude (Stufe 2 des Suhl-Plans, Paket S2-2, Auftrag docs/plans/auftraege/suhl-gebaeude.md): ein Datensatz je Gebäude der ganzen
# Stadt Suhl in Kacheln der Stufe 10 (suhl/g/v<N>/10/<x>/<y>.json, Schema docs/features/suhl-daten.md) aus
#   ETHOS.BUILDA (Zenodo, 882 MB im Strom gefiltert) · Kataster-WFS „ALKIS vereinfacht“ (nur ave:GebaeudeBauwerk, in Kästen, mit Pausen) ·
#   OpenStreetMap (Geofabrik-Auszug, osmium) · Luftbild des Landes (WMS, je Kachel ein Bild 0,4 m: Dachdeckung und Dachfarbe) ·
#   Oberflächenmodell DOM1 und Gelände DGM1 über easygeodata.de (secrets.EASYGEODATA_KEY: Dachform, First, Traufe gemessen) ·
#   Zensus-Gitter 2022 (Baualter) · Gelände für die Fußhöhen (Kacheln von suhl-boden, sonst Copernicus).
# Dazu die Prüfungen (Plan 5.3) und der Prüfer des Datenvertrags. Ergebnis: Artefakt „suhl-gebaeude-kacheln“, Zahlen nach
# tools/suhl/out/gebaeude/actions/ und der Probesatz des Zentrums nach tools/suhl/out/gebaeude/probe/suhl/g/v<N>/ auf suhl/gebaeude;
# der zweite Job gibt die Kacheln an die Aktion suhl-publish (Daten-Repo pavillon-daten). Fehlt ein Geheimnis oder eine Quelle, wird
# der Schritt mit einer klaren Zeile übersprungen – nie ein roter Lauf deswegen.
# Läuft nur auf suhl/gebaeude und nur, wenn diese Datei oder tools/suhl/gebaeude/lauf.txt sich ändert (lauf.txt ändern = neuen Lauf
# bestellen; dort stehen Version und easygeodata-Umfang). Ein neuer Lauf bricht einen älteren ab; alle Downloads liegen im Actions-Cache.
name: Suhl – Gebäude (ganze Stadt)

on:
  push:
    branches: ['suhl/gebaeude']
    paths: ['.github/workflows/suhl-gebaeude.yml', 'tools/suhl/gebaeude/lauf.txt']

concurrency:
  group: suhl-gebaeude
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  gebaeude:
    name: Datensätze der ganzen Stadt
    runs-on: ubuntu-latest
    timeout-minutes: 110
    outputs:
      version: ${{ steps.auftrag.outputs.version }}
      publish: ${{ steps.auftrag.outputs.publish }}
      gueltig: ${{ steps.vertrag.outputs.gueltig }}
    env:
      SUHL_RAW: /home/runner/suhl-raw
      UA: 'PavillonRatscher-Suhl/0.1 (+https://github.com/mynametouse/pavillon-ratscher)'
      OUT: /home/runner/suhl-out
    steps:
      - uses: actions/checkout@v4
        with:
          ref: suhl/gebaeude
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Auftrag (tools/suhl/gebaeude/lauf.txt) und Werkzeuge
        id: auftrag
        run: |
          V=$(grep -E '^version:' tools/suhl/gebaeude/lauf.txt | grep -oE '[0-9]+' | tail -1)
          P=$(grep -E '^easygeodata:' tools/suhl/gebaeude/lauf.txt | sed 's/^easygeodata: *//' | tr -d ' ' | tail -1)
          echo "VERSION=v${V:-1}" >> "$GITHUB_ENV"; echo "version=v${V:-1}" >> "$GITHUB_OUTPUT"
          echo "EGD_PRIO=${P:-P1}" >> "$GITHUB_ENV"
          if grep -qE '^veroeffentlichen: *ja' tools/suhl/gebaeude/lauf.txt; then echo "publish=ja" >> "$GITHUB_OUTPUT"; else echo "publish=nein" >> "$GITHUB_OUTPUT"; fi
          cat tools/suhl/gebaeude/lauf.txt
          pip install --quiet numpy shapely pyproj pillow mapbox_earcut tifffile imagecodecs requests
          sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
          mkdir -p "$SUHL_RAW" "$OUT" logs tools/suhl/out/gebaeude/actions
          python -I tools/suhl/gebaeude/dom.py --selftest | tail -1
          python -I tools/suhl/gebaeude/zensus.py --selftest
      - name: Rohdaten aus dem Cache (Downloads früherer Läufe)
        uses: actions/cache/restore@v4
        with:
          path: ~/suhl-raw
          key: suhl-gebaeude-raw-v1-${{ github.run_id }}
          restore-keys: |
            suhl-gebaeude-raw-v1-
      - name: OpenStreetMap – Geofabrik-Auszug Thüringen, auf Suhl geschnitten (OPL)
        timeout-minutes: 15
        run: |
          set -o pipefail
          mkdir -p "$SUHL_RAW/geofabrik"
          P="$SUHL_RAW/geofabrik/suhl.opl.gz"
          if [ ! -s "$P" ]; then
            curl -sSfL --retry 3 --retry-delay 20 -A "$UA" -o "$RUNNER_TEMP/th.osm.pbf" https://download.geofabrik.de/europe/germany/thueringen-latest.osm.pbf
            osmium fileinfo "$RUNNER_TEMP/th.osm.pbf" | grep -E "timestamp|Bounding" | tee "$SUHL_RAW/geofabrik/fileinfo.txt"
            # the bounding box of the municipality (OSM relation 62450) + 0.004 degrees, as in tools/suhl/bestand/osm_api.py
            osmium extract -b 10.5482,50.5568,10.8466,50.6929 -s smart "$RUNNER_TEMP/th.osm.pbf" -o "$RUNNER_TEMP/suhl.osm.pbf"
            osmium cat "$RUNNER_TEMP/suhl.osm.pbf" -f opl | gzip -6 > "$P"
            rm -f "$RUNNER_TEMP/th.osm.pbf"
          fi
          ls -la "$SUHL_RAW/geofabrik"; cat "$SUHL_RAW/geofabrik/fileinfo.txt" || true
      - name: ETHOS.BUILDA – DEG.csv (Zenodo 11845992) im Strom auf Suhl gefiltert
        timeout-minutes: 25
        run: |
          set -o pipefail
          mkdir -p "$SUHL_RAW/ethos"
          P="$SUHL_RAW/ethos/suhl.jsonl"
          if [ ! -s "$P" ]; then
            curl -sSL --retry 3 --retry-delay 20 -A "$UA" https://zenodo.org/api/records/11845992/files/DEG.csv/content \
              | python -I -u tools/suhl/bestand/ethos_filter.py "$P.part" 2>&1 | tee logs/ethos_filter.log
            mv "$P.part" "$P"
          fi
          ls -la "$SUHL_RAW/ethos"; wc -l "$P"
      - name: Kataster – WFS „ALKIS vereinfacht“, nur ave:GebaeudeBauwerk, in Kästen mit Pausen
        timeout-minutes: 25
        run: |
          set -o pipefail
          python -I -u tools/suhl/gebaeude/alkis.py --area stadt --summary tools/suhl/out/gebaeude/actions/alkis_stadt.json 2>&1 | tee logs/alkis.log
      - name: Oberflächenmodell DOM1 und Gelände DGM1 über easygeodata.de (übersprungen, wenn der Schlüssel fehlt)
        timeout-minutes: 30
        continue-on-error: true
        env:
          EASYGEODATA_KEY: ${{ secrets.EASYGEODATA_KEY }}
        run: |
          set -o pipefail
          python -I -u tools/suhl/lib/easygeodata.py --product dgm,dom --prio "$EGD_PRIO" --raw "$SUHL_RAW" --report logs/egd.json 2>&1 | tee logs/egd.log
          cp logs/egd.json tools/suhl/out/gebaeude/actions/easygeodata.json 2>/dev/null || true
          ls "$SUHL_RAW/dom1" 2>/dev/null | wc -l; ls "$SUHL_RAW/dgm1" 2>/dev/null | wc -l
      - name: Zensus-Gitter 2022 – Gebäude nach Baujahr (100 m), auf Suhl geschnitten (übersprungen, wenn die Datei nicht zu finden ist)
        timeout-minutes: 15
        continue-on-error: true
        run: |
          mkdir -p "$SUHL_RAW/zensus"
          Z="$SUHL_RAW/zensus/baujahr.zip"
          : > logs/zensus.log
          if [ ! -s "$Z" ]; then
            for B in https://www.destatis.de/static/DE/zensus/gitterdaten https://static.destatis.de/static/DE/zensus/gitterdaten https://www.zensus2022.de/static/Zensus_Veroeffentlichung; do
              for N in Zensus2022_Baujahr_in_Mikrozensus_Klassen.zip Zensus2022_Gebaeude_nach_Baujahr_in_Mikrozensus_Klassen.zip Gebaeude_nach_Baujahr_in_Mikrozensus_Klassen.zip \
                       Zensus2022_Baujahr_Jahrzehnte.zip Zensus2022_Gebaeude_nach_Baujahr_Jahrzehnte.zip Gebaeude_nach_Baujahr_Jahrzehnte.zip Zensus2022_Baujahr.zip; do
                C=$(curl -sS -L -m 600 -A "$UA" -o "$Z.part" -w '%{http_code} %{size_download}' "$B/$N" || echo "000 0")
                echo "$C $B/$N" | tee -a logs/zensus.log
                if [ "${C%% *}" = "200" ] && [ "$(head -c 2 "$Z.part")" = "PK" ]; then mv "$Z.part" "$Z"; echo "$B/$N" > "$SUHL_RAW/zensus/quelle.txt"; break 2; fi
                rm -f "$Z.part"; sleep 2
              done
            done
          fi
          if [ -s "$Z" ]; then
            python -I -u tools/suhl/gebaeude/zensus.py --filter "$Z" --out tools/suhl/out/gebaeude/actions/zensus_baujahr.json 2>&1 | tee -a logs/zensus.log
          else
            echo "ÜBERSPRUNGEN: keine der vermuteten Adressen der Zensus-Gitterdatei „Gebäude nach Baujahr“ hat eine ZIP-Datei geliefert (Liste oben) – das Baualter bleibt bei den Regeln" | tee -a logs/zensus.log
          fi
          cp logs/zensus.log tools/suhl/out/gebaeude/actions/zensus_abruf.txt
      - name: Datensätze bauen (Dach aus Oberflächenmodell, sonst Regel; Deckung und Farbe aus dem Luftbild; Seiten; Nutzung; Baualter)
        timeout-minutes: 60
        run: |
          set -o pipefail
          python -I -u tools/suhl/gebaeude/bauen.py --area stadt --opl "$SUHL_RAW/geofabrik/suhl.opl.gz" --dop --dop-workers 2 --dom "$SUHL_RAW" \
            --zensus tools/suhl/out/gebaeude/actions/zensus_baujahr.json --out "$OUT/suhl/g/$VERSION" --version "$VERSION" 2>&1 | tee logs/bauen.log
      - name: Fußhöhen – Geländekacheln von suhl-boden (Daten-Repo), sonst Copernicus (vorläufig)
        timeout-minutes: 15
        run: |
          set -o pipefail
          BASE="https://mynametouse.github.io/pavillon-daten/suhl"
          V=$(curl -sSfL -m 30 -A "$UA" "$BASE/aktuell.json" 2>/dev/null | python -c "import json,sys; print(json.load(sys.stdin)['products']['boden']['version'])" 2>/dev/null || true)
          if [ -n "$V" ]; then
            echo "Geländekacheln von suhl-boden, Version $V"
            python -I -u tools/suhl/gebaeude/fuss.py --tiles "$OUT/suhl/g/$VERSION" --terrain "$BASE/boden/v$V/t" --boden "$V" --q 1 \
              --source "Geländekacheln suhl-boden v$V (pavillon-daten)" 2>&1 | tee logs/fuss.log || { echo "die Geländekacheln decken die Stadt nicht – Copernicus"; V=""; }
          fi
          if [ -z "$V" ]; then
            echo "keine veröffentlichten Geländekacheln von suhl-boden – Fußhöhen aus Copernicus GLO-30 (vorläufig, ohne based_on: die Laufzeit nimmt ihren Boden)"
            python -I -u tools/suhl/gebaeude/fuss.py --tiles "$OUT/suhl/g/$VERSION" --cop "$SUHL_RAW" 2>&1 | tee logs/fuss.log
          fi
      - name: Prüfungen (Plan 5.3)
        timeout-minutes: 15
        run: |
          set -o pipefail
          python -I -u tools/suhl/gebaeude/pruefen.py --tiles "$OUT/suhl/g/$VERSION" --area stadt \
            --out tools/suhl/out/gebaeude/actions/pruefen_stadt.json 2>&1 | tee logs/pruefen.log
      - name: Prüfer des Datenvertrags (tools/suhl/lib/validate.py)
        id: vertrag
        timeout-minutes: 15
        run: |
          set -o pipefail
          python -I -u tools/suhl/lib/validate.py "$OUT" --quiet --json tools/suhl/out/gebaeude/actions/vertrag_stadt.json 2>&1 | tail -40 | tee logs/vertrag.log
          echo "gueltig=true" >> "$GITHUB_OUTPUT"
      - name: Probesatz des Zentrums (11 Kacheln) mit denselben Eingaben
        if: always()
        timeout-minutes: 15
        continue-on-error: true
        run: |
          set -o pipefail
          PR="tools/suhl/out/gebaeude/probe/suhl/g/$VERSION"
          rm -rf "$PR"
          python -I -u tools/suhl/gebaeude/bauen.py --area probe --alkis "$SUHL_RAW/alkis/stadt.jsonl" --opl "$SUHL_RAW/geofabrik/suhl.opl.gz" --dop --dom "$SUHL_RAW" \
            --zensus tools/suhl/out/gebaeude/actions/zensus_baujahr.json --out "$PR" --version "$VERSION" 2>&1 | tee logs/bauen_probe.log
          mv "tools/suhl/out/gebaeude/probe/suhl/g/bauen_probe.json" tools/suhl/out/gebaeude/actions/bauen_probe.json
          # the feet: the terrain sample of suhl-boden on its branch (the highest version there), else Copernicus
          git fetch -q --depth 1 origin suhl/boden || true
          T=$(git ls-tree -d --name-only FETCH_HEAD tools/suhl/out/boden/probe/suhl/boden/ 2>/dev/null | sort -V | tail -1)
          if [ -n "$T" ] && git archive FETCH_HEAD "$T/t" "$T/meta.json" | tar -x -C "$RUNNER_TEMP"; then
            BV=$(basename "$T" | tr -d 'v')
            if grep -q '"terrain_source": *"[^"]*dgm1' "$RUNNER_TEMP/$T/meta.json"; then Q=2; SID=dgm1; else Q=1; SID=cop30; fi
            python -I -u tools/suhl/gebaeude/fuss.py --tiles "$PR" --terrain "$RUNNER_TEMP/$T/t" --boden "$BV" --q "$Q" --src-id "$SID" \
              --source "Geländekacheln suhl-boden v$BV, Probesatz (origin/suhl/boden $(git rev-parse --short FETCH_HEAD))" 2>&1 | tee logs/fuss_probe.log \
              || python -I -u tools/suhl/gebaeude/fuss.py --tiles "$PR" --cop "$SUHL_RAW" 2>&1 | tee -a logs/fuss_probe.log
          else
            python -I -u tools/suhl/gebaeude/fuss.py --tiles "$PR" --cop "$SUHL_RAW" 2>&1 | tee logs/fuss_probe.log
          fi
          python -I -u tools/suhl/gebaeude/pruefen.py --tiles "$PR" --area probe --max-bytes 3000000 --out tools/suhl/out/gebaeude/actions/pruefen_probe.json 2>&1 | tee logs/pruefen_probe.log || true
          python -I -u tools/suhl/lib/validate.py "$PR" --quiet 2>&1 | tail -15 | tee logs/vertrag_probe.log || true
          du -sb "$PR"
      - name: Zahlen und Größen
        if: always()
        run: |
          cp "$OUT/suhl/g/bauen_stadt.json" tools/suhl/out/gebaeude/actions/bauen_stadt.json 2>/dev/null || true
          cp "$OUT/suhl/g/$VERSION/index.json" tools/suhl/out/gebaeude/actions/index_stadt.json 2>/dev/null || true
          if [ -d "$OUT/suhl/g/$VERSION" ]; then
            ( cd "$OUT" && tar -czf "$RUNNER_TEMP/suhl-g-$VERSION.tar.gz" suhl/g/$VERSION )
            RAWB=$(du -sb "$OUT/suhl/g/$VERSION" | cut -f1); GZB=$(stat -c %s "$RUNNER_TEMP/suhl-g-$VERSION.tar.gz")
            NT=$(find "$OUT/suhl/g/$VERSION" -name '*.json' -path '*/10/*' | wc -l)
            printf '{"run_id": "%s", "version": "%s", "tiles": %s, "bytes_raw": %s, "bytes_tar_gz": %s, "made": "%s"}\n' "$GITHUB_RUN_ID" "$VERSION" "$NT" "$RAWB" "$GZB" "$(date -u +%FT%TZ)" \
              | tee tools/suhl/out/gebaeude/actions/lauf.json
          fi
          du -sh "$SUHL_RAW"/* 2>/dev/null || true
      - name: Inhalt der Rohdaten (neuer Cache nur, wenn etwas dazukam)
        if: always()
        run: echo "RAWKEY=$(cd "$SUHL_RAW" 2>/dev/null && find . -type f -printf '%P %s\n' | sort | sha1sum | cut -c1-16)" >> "$GITHUB_ENV"
      - name: Rohdaten in den Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/suhl-raw
          key: suhl-gebaeude-raw-v1-${{ env.RAWKEY }}
      - name: Kacheln als Artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suhl-gebaeude-kacheln
          path: ${{ runner.temp }}/suhl-g-*.tar.gz
          if-no-files-found: ignore
          retention-days: 30
          compression-level: 0
      - name: Zahlen und Probesatz nach suhl/gebaeude (nur tools/suhl/out/gebaeude/actions/ und …/probe/suhl/g/)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f tools/suhl/out/gebaeude/actions
          if [ -f "tools/suhl/out/gebaeude/probe/suhl/g/$VERSION/index.json" ]; then git add -f "tools/suhl/out/gebaeude/probe/suhl/g/$VERSION"; fi
          if git diff --cached --quiet; then echo "keine Änderung"; exit 0; fi
          if git diff --cached --name-only | grep -v -e '^tools/suhl/out/gebaeude/actions/' -e '^tools/suhl/out/gebaeude/probe/suhl/g/' | grep -q .; then echo "fremde Pfade im Commit"; exit 1; fi
          printf '%s\n\n%s\n%s\n' "suhl-gebaeude: numbers and the sample set of the Actions run ${GITHUB_RUN_ID} (the whole city ${VERSION}: counts, checks, sizes)" \
            "Co-Authored-By: Claude Fable 5.2 <noreply@anthropic.com>" \
            "Claude-Session: https://claude.ai/code/session_01L6YrpcuzUozgpZNSC5CdVL" > "$RUNNER_TEMP/msg.txt"
          git commit -q -F "$RUNNER_TEMP/msg.txt"
          for i in 1 2 3 4 5; do
            if git pull -q --rebase origin suhl/gebaeude && git push -q origin HEAD:suhl/gebaeude; then echo "gepusht"; break; fi
            echo "Push abgelehnt (Versuch $i)"; sleep $((15 * i))
          done
      - name: Protokolle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suhl-gebaeude-logs
          path: |
            logs/
            tools/suhl/out/gebaeude/actions/
          if-no-files-found: ignore
          retention-days: 10

  veroeffentlichen:
    name: Kacheln ins Daten-Repo (Aktion suhl-publish von suhl-daten)
    needs: gebaeude
    if: ${{ needs.gebaeude.outputs.gueltig == 'true' && needs.gebaeude.outputs.publish == 'ja' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: suhl-daten-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: suhl/gebaeude
      - uses: actions/download-artifact@v4
        with:
          name: suhl-gebaeude-kacheln
          path: ${{ runner.temp }}/art
      - name: Auspacken
        run: |
          mkdir -p out && tar -xzf "$RUNNER_TEMP"/art/suhl-g-*.tar.gz -C out
          ls out/suhl/g; du -sh out/suhl/g/*
      - uses: ./.github/actions/suhl-publish
        with:
          folder: out/suhl/g/${{ needs.gebaeude.outputs.version }}
          token: ${{ secrets.DATEN_TOKEN }}
          artifact: suhl-g-${{ needs.gebaeude.outputs.version }}-unveroeffentlicht
