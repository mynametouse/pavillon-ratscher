# Live stellen: der freigegebene Stand von src kommt auf die normale Website (die Vorschau unter /vorschau/ bleibt, plan.json und welt-test/
# bleiben unangetastet). Zwei Wege:
#   - der Kern-Chat schiebt den Stand nach Branch `live` (git push origin src:live) – Chat-Sitzungen dürfen Workflows nicht von Hand starten
#   - von Hand: GitHub → Actions → „Live stellen“ → Run workflow (der Knopf erscheint nur, wenn der Standard-Branch des Repos `src` ist)
name: Live stellen

on:
  push:
    branches: [live]
  workflow_dispatch:
    inputs:
      version:
        description: 'Versionsname für die Commit-Nachricht (z. B. V17a)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  live:
    name: Website aktualisieren
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'src' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Website holen (Branch gh-pages)
        run: |
          git clone -q --depth 1 --branch gh-pages --single-branch "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "$RUNNER_TEMP/site"
          mkdir -p viz3/dist
          B="$RUNNER_TEMP/site"; [ -f "$B/vorschau/index.html" ] && B="$B/vorschau"
          (cd "$B" && tar --exclude=.git --exclude=./vorschau --exclude=./welt-test -cf - .) | (cd viz3/dist && tar -xf -)
          # KTX2 textures (texturen-ktx2.yml): the site's tex2/ for the build (TEX2MAN); deploy_site.py leaves the site's own in place
          if [ -d "$RUNNER_TEMP/site/tex2" ]; then rm -rf viz3/dist/tex2 && cp -r "$RUNNER_TEMP/site/tex2" viz3/dist/tex2; fi
      - name: Bauen wie veröffentlicht
        run: |
          npm ci --prefix viz3 --no-audit --no-fund
          python viz3/build.py --fast --min
          rm -rf viz3/dist_pub && cp -a viz3/dist viz3/dist_pub
      - name: Website schreiben und hochladen
        run: |
          python viz3/deploy_site.py dist_pub "$RUNNER_TEMP/site"
          cd "$RUNNER_TEMP/site"
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "${{ inputs.version }} live: $(git -C "$GITHUB_WORKSPACE" log -1 --format='%h %s' | cut -c1-100)" || { echo "nichts geändert"; exit 0; }
          for i in 1 2 3; do git push -q origin HEAD:gh-pages && break; git pull -q --rebase origin gh-pages; done
          echo "Live: https://mynametouse.github.io/pavillon-ratscher/"
