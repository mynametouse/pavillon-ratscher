<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Welt-Testblock Ratscher</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg: #c9dcea; --panel: rgba(18, 24, 30, 0.78); --ink: #f1f4f6; --dim: #a9b6c0; --acc: #f2b84b; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #hud { position: fixed; z-index: 2; top: max(8px, env(safe-area-inset-top)); left: 8px; right: 8px; pointer-events: none; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  .box { background: var(--panel); border-radius: 8px; padding: 7px 10px; pointer-events: auto; max-width: min(560px, calc(100vw - 16px)); box-sizing: border-box; }
  h1 { font-size: 14px; margin: 0 0 2px; font-weight: 650; letter-spacing: 0.01em; }
  #stats { color: var(--dim); font-variant-numeric: tabular-nums; }
  #src { color: var(--acc); }
  .row { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; margin-top: 5px; }
  button, select { font: inherit; color: var(--ink); background: #2c3a46; border: 1px solid #4b5d6c; border-radius: 6px; padding: 4px 9px; cursor: pointer; }
  button.on { background: #b9832a; border-color: #e0a647; color: #111; }
  input[type=range] { width: 110px; vertical-align: middle; }
  #drive { display: none; }
  #help { color: var(--dim); font-size: 12px; }
  #attr { position: fixed; z-index: 2; left: 8px; right: 8px; bottom: max(6px, env(safe-area-inset-bottom)); font-size: 11px; color: #1e2a33; background: rgba(255, 255, 255, 0.72); border-radius: 6px; padding: 3px 8px; pointer-events: auto; }
  #attr a { color: inherit; }
  #msg { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--panel); padding: 12px 16px; border-radius: 10px; display: none; max-width: 80vw; }
  @media (max-width: 600px) { #help { display: none; } .box { padding: 6px 8px; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="box">
    <h1>Welt-Testblock Ratscher</h1>
    <div id="stats">lädt …</div>
    <div id="src"></div>
    <div class="row">
      <button id="m-orbit" class="on">Umkreisen</button><button id="m-fly">Fliegen</button><button id="m-drive">Fahren</button>
      <select id="goto" aria-label="Ort">
        <option value="">Ort …</option><option value="garten">Garten</option><option value="dorf">Ratscher</option>
        <option value="talsperre">Talsperre</option><option value="schleusingen">Schleusingen</option><option value="ueberblick">Überblick</option>
      </select>
    </div>
    <div class="row" id="drive">
      <select id="route" aria-label="Strecke"></select>
      <label>Tempo <input id="speed" type="range" min="10" max="100" value="50"> <span id="kmh">50 km/h</span></label>
      <button id="pause">Halt</button>
      <a id="prof" target="_blank" rel="noopener" style="color:#f2b84b">Profil vorher/nachher</a>
      <span id="grade"></span>
    </div>
    <div id="help">Umkreisen: ziehen, Mausrad · Fliegen: ziehen = umsehen, W A S D / Pfeile, Q E hoch/runter, Umschalt = schnell · Fahren: entlang der Straße (Leertaste = Halt)</div>
  </div>
</div>
<div id="attr"></div>
<div id="msg"></div>
<script type="module" src="./viewer.js"></script>
</body>
</html>
